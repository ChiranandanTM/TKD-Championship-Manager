<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taekwondo Championship - Login</title>
    <!-- Favicon - Multiple sizes for better visibility -->
    <link rel="icon" type="image/jpeg" href="/assets/images/favicon.jpeg" sizes="any">
    <link rel="apple-touch-icon" href="/assets/images/favicon.jpeg">
    <meta name="theme-color" content="#FFD700">
    <meta name="description" content="Login portal for the Taekwondo Championship Manager — Admin, Team, and Referee access to manage players, brackets, and live matches.">
    <!-- Resource hints for faster CDN loading -->
    <link rel="preconnect" href="https://taekowndo-championship-default-rtdb.asia-southeast1.firebasedatabase.app">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://firebase.googleapis.com">
    <link rel="dns-prefetch" href="https://taekowndo-championship-default-rtdb.asia-southeast1.firebasedatabase.app">
    <!-- Preload critical resources -->
    <link rel="preload" as="style" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <style>
        body {
            background-image: url('/assets/images/tkd-background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .pw-wrap {
            position: relative
        }

        .pw-wrap input {
            padding-right: 44px
        }

        .pw-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: color .2s
        }

        .pw-toggle:hover {
            color: #FFD700
        }
    </style>
    <script src="/js/history-protection.js"></script>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🥋 TAEKWONDO<br>CHAMPIONSHIP<br>MANAGER</h1>
            <p
                style="color: #00E5FF; font-size: 1.3rem; margin-top: 15px; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);">
                Karnataka State Championship</p>
        </div>

        <!-- Tab Navigation -->
        <div class="login-tabs">
            <button class="tab-btn active" onclick="switchTab('admin')" id="tabBtnAdmin">Admin</button>
            <button class="tab-btn" onclick="switchTab('team')" id="tabBtnTeam">Coach</button>
            <button class="tab-btn" onclick="switchTab('referee')" id="tabBtnReferee">Referee</button>
        </div>

        <!-- Admin Login Form -->
        <div id="adminTab" class="tab-content active">
            <form id="adminLoginForm" onsubmit="loginAdmin(event)">
                <div class="form-group">
                    <label for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" required placeholder="admin@tkd.com">
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="adminPassword" required placeholder="Enter password">
                        <button type="button" class="pw-toggle" onclick="togglePw('adminPassword',this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Login as Admin</button>
            </form>
        </div>

        <!-- Team Login Form -->
        <div id="teamTab" class="tab-content">
            <form id="teamLoginForm" onsubmit="loginTeam(event)">
                <div class="form-group">
                    <label for="teamUsername">Username</label>
                    <input type="text" id="teamUsername" required placeholder="Enter team username">
                </div>
                <div class="form-group">
                    <label for="teamPassword">Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="teamPassword" required placeholder="Enter password">
                        <button type="button" class="pw-toggle" onclick="togglePw('teamPassword',this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Login as Coach</button>
            </form>
        </div>

        <!-- Referee Login Form -->
        <div id="refereeTab" class="tab-content">
            <form id="refereeLoginForm" onsubmit="loginReferee(event)">
                <div class="form-group">
                    <label for="refereeId">Referee ID</label>
                    <input type="text" id="refereeId" required placeholder="e.g. REF001">
                </div>
                <div class="form-group">
                    <label for="refereePassword">Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="refereePassword" required placeholder="Enter password">
                        <button type="button" class="pw-toggle" onclick="togglePw('refereePassword',this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Login as Referee</button>
            </form>
        </div>

        <div class="site-credit-footer">
            <span class="credit-line">© Karnataka Taekwondo Association</span>
            <span class="credit-line credit-owner">Built and Developed by Chiranandan T M</span>
            <span class="credit-line credit-supporter">Co-Supporter: Sharan B N</span>
        </div>
    </div>

    <!-- Password visibility toggle -->
    <script>
        function togglePw(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            
            const eyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            const eyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            
            btn.innerHTML = isHidden ? eyeClosed : eyeOpen;
        }
    </script>

    <!-- Firebase SDK v11 -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
        import { getDatabase, ref, set, get, update, remove, onValue, push, query, orderByChild, equalTo, child } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js';
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js';

        // ── PASSWORD HASHING ────────────────────────────────────────────────
        async function hashPassword(plain) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('TKDCM:' + plain));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        function isLegacyPassword(stored) { return !/^[0-9a-f]{64}$/.test(stored); }

        const firebaseConfig = {
            apiKey: "AIzaSyC7NfS7RMv8C78KGJsPkQCeV9fzmJ86lDU",
            authDomain: "taekowndo-championship.firebaseapp.com",
            databaseURL: "https://taekowndo-championship-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "taekowndo-championship",
            storageBucket: "taekowndo-championship.firebasestorage.app",
            messagingSenderId: "747830683087",
            appId: "1:747830683087:web:3a7461d1a54d475f1cdeba"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const storage = getStorage(app);

        // Export for global use
        window.firebaseApp = app;
        window.auth = auth;
        window.database = database;
        window.storage = storage;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbGet = get;
        window.dbUpdate = update;
        window.dbRemove = remove;
        window.dbOnValue = onValue;
        window.dbPush = push;
        window.dbQuery = query;
        window.dbOrderByChild = orderByChild;
        window.dbEqualTo = equalTo;
        window.dbChild = child;
        window.storageRef = storageRef;
        window.uploadBytes = uploadBytes;
        window.getDownloadURL = getDownloadURL;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;

        console.log("✅ Firebase v9 initialized successfully");

        // UI HELPER
        window.UI = {
            showLoading(message = 'Loading...') {
                const existing = document.getElementById('loadingOverlay');
                if (existing) existing.remove();

                const overlay = document.createElement('div');
                overlay.id = 'loadingOverlay';
                overlay.className = 'loading-overlay';
                overlay.innerHTML = `
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p>${message}</p>
                    </div>
                `;
                document.body.appendChild(overlay);
            },

            hideLoading() {
                const overlay = document.getElementById('loadingOverlay');
                if (overlay) overlay.remove();
            }
        };

        // SECURE LOGIN ATTEMPT PROTECTION
        window.RATE_LIMITER = {
            maxAttempts: 3,
            lockTime: 60 * 1000,
            
            checkLimit() {
                const stored = localStorage.getItem('loginAttempts');
                if (stored) {
                    const data = JSON.parse(stored);
                    if (data.lockedUntil && Date.now() < data.lockedUntil) {
                        this.enforceLock(data.lockedUntil);
                        return false; 
                    } else if (data.lockedUntil && Date.now() >= data.lockedUntil) {
                        localStorage.removeItem('loginAttempts');
                        return true;
                    }
                }
                return true; 
            },
            
            recordFailure() {
                let data = { attempts: 0, lockedUntil: null };
                const stored = localStorage.getItem('loginAttempts');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (!parsed.lockedUntil || Date.now() >= parsed.lockedUntil) {
                        data = parsed;
                    }
                }
                
                data.attempts += 1;
                
                if (data.attempts >= this.maxAttempts) {
                    data.lockedUntil = Date.now() + this.lockTime;
                    localStorage.setItem('loginAttempts', JSON.stringify(data));
                    this.enforceLock(data.lockedUntil);
                    return { locked: true, remaining: 0 };
                }
                
                localStorage.setItem('loginAttempts', JSON.stringify(data));
                return { locked: false, remaining: this.maxAttempts - data.attempts };
            },
            
            reset() {
                localStorage.removeItem('loginAttempts');
            },
            
            enforceLock(lockedUntil) {
                const buttons = document.querySelectorAll('button[type="submit"]');
                const inputs = document.querySelectorAll('input');
                
                buttons.forEach(btn => {
                    if (!btn.dataset.originalText) btn.dataset.originalText = btn.innerText;
                    btn.disabled = true;
                });
                inputs.forEach(input => input.disabled = true);
                
                const updateTimer = () => {
                    const remaining = Math.ceil((lockedUntil - Date.now()) / 1000);
                    if (remaining <= 0) {
                        buttons.forEach(btn => {
                            btn.disabled = false;
                            btn.innerText = btn.dataset.originalText;
                        });
                        inputs.forEach(input => input.disabled = false);
                        localStorage.removeItem('loginAttempts');
                    } else {
                        buttons.forEach(btn => btn.innerText = `Try again in ${remaining}s`);
                        setTimeout(updateTimer, 1000);
                    }
                };
                updateTimer();
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            RATE_LIMITER.checkLimit();
        });

        // AUTH MANAGER
        window.AUTH_MANAGER = {
            currentUser: null,
            currentRole: null,
            currentTeamId: null,

            init() {
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        this.currentUser = user;
                        await this.loadUserRole(user.uid);
                        this.redirectBasedOnRole();
                    } else {
                        this.currentUser = null;
                        this.currentRole = null;
                        this.currentTeamId = null;
                    }
                });
            },

            async loadUserRole(uid) {
                try {
                    console.log("🔍 Loading role for UID:", uid);
                    const userRef = ref(database, `users/${uid}`);
                    const snapshot = await get(userRef);

                    console.log("📊 Snapshot exists?", snapshot.exists());

                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        console.log("📦 User data:", userData);

                        this.currentRole = userData.role;
                        this.currentTeamId = userData.teamId || null;

                        console.log("👤 Role:", this.currentRole);
                        console.log("👤 Role type:", typeof this.currentRole);

                        sessionStorage.setItem('userRole', this.currentRole);
                        sessionStorage.setItem('userId', uid);
                        if (this.currentTeamId) {
                            sessionStorage.setItem('teamId', this.currentTeamId);
                        }

                        return this.currentRole;
                    } else {
                        // ── BOOTSTRAP: Firebase Auth succeeded but no DB record exists.
                        // This happens on first login or after a database wipe.
                        // Since only valid Firebase Auth credentials can reach here,
                        // auto-create the admin record and allow login.
                        console.log("⚠️ No DB record found — auto-creating admin entry for UID:", uid);
                        try {
                            await set(ref(database, `users/${uid}`), {
                                role: 'admin',
                                uid: uid,
                                createdAt: new Date().toISOString()
                            });
                            console.log("✅ Admin record created in database");
                        } catch (writeErr) {
                            console.warn("⚠️ Could not write admin record:", writeErr.message);
                        }
                        this.currentRole = 'admin';
                        sessionStorage.setItem('userRole', 'admin');
                        sessionStorage.setItem('userId', uid);
                        return 'admin';
                    }

                    return null;
                } catch (error) {
                    console.error("❌ Error loading user role:", error);
                    return null;
                }
            },

            async loginAdmin(email, password) {
                try {
                    console.log("🔐 Starting admin login...");
                    console.log("📧 Email:", email);

                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    console.log("✅ Firebase Auth successful!");
                    console.log("🆔 UID:", userCredential.user.uid);

                    const role = await this.loadUserRole(userCredential.user.uid);
                    console.log("🎭 Final role:", role);
                    console.log("🎭 Role === 'admin':", role === 'admin');
                    console.log("🎭 Role === 'judge':", role === 'judge');

                    if (role !== 'admin' && role !== 'judge') {
                        console.log("❌ Role check failed!");
                        await signOut(auth);
                        throw new Error("Access denied. Admin or Judge credentials required.");
                    }

                    // Store login page URL for logout redirect
                    sessionStorage.setItem('loginPageUrl', window.location.href);

                    console.log("✅ Login successful!");
                    return { success: true, role, uid: userCredential.user.uid };
                } catch (error) {
                    console.error("❌ Admin login error:", error);
                    throw new Error(error.message);
                }
            },

            async loginTeam(username, password) {
                try {
                    const trimmedUsername = (username || '').trim().toLowerCase();
                    const trimmedPassword = (password || '').trim();

                    if (!trimmedUsername || !trimmedPassword) {
                        throw new Error("Invalid username or password");
                    }

                    // Fetch ALL teams and search locally - avoids index requirement
                    const teamsRef = ref(database, 'teams');
                    const allTeamsSnapshot = await get(teamsRef);

                    if (!allTeamsSnapshot.exists()) {
                        throw new Error("Invalid username or password");
                    }

                    let teamData = null;
                    let teamId = null;

                    allTeamsSnapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        if (data.username && data.username.trim().toLowerCase() === trimmedUsername) {
                            teamData = data;
                            teamId = childSnapshot.key;
                        }
                    });

                    if (!teamData) {
                        throw new Error("Invalid username or password");
                    }

                    const hashedInput = await hashPassword(trimmedPassword);
                    const storedPw = teamData.password;
                    if (isLegacyPassword(storedPw)) {
                        if (storedPw !== trimmedPassword) throw new Error("Invalid username or password");
                        try { await update(ref(database, `teams/${teamId}`), { password: hashedInput }); } catch (_) {}
                    } else {
                        if (storedPw !== hashedInput) throw new Error("Invalid username or password");
                    }

                    // Save session
                    this.currentRole = 'team';
                    this.currentTeamId = teamId;
                    sessionStorage.setItem('userId', teamId);
                    sessionStorage.setItem('userRole', 'team');
                    sessionStorage.setItem('teamId', teamId);
                    sessionStorage.setItem('teamName', teamData.teamName || '');

                    // Store login page URL for logout redirect
                    sessionStorage.setItem('loginPageUrl', window.location.href);

                    // Write user role to DB so auth.js can find it
                    await set(ref(database, 'users/' + teamId), {
                        role: 'team',
                        teamId: teamId,
                        email: teamData.email || '',
                        teamName: teamData.teamName || '',
                        username: teamData.username
                    });

                    return { success: true, role: 'team', uid: teamId, teamId };
                } catch (error) {
                    console.error("❌ Team login error:", error);
                    throw new Error(error.message);
                }
            },

            redirectBasedOnRole() {
                if (!this.currentRole) return;

                const path = window.location.pathname;

                if (path.includes('index.html') || path === '/' || path === '') {
                    if (this.currentRole === 'admin' || this.currentRole === 'judge') {
                        window.location.href = window.location.origin + '/admin/dashboard.html';
                    } else if (this.currentRole === 'team') {
                        window.location.href = window.location.origin + '/team/dashboard.html';
                    } else if (this.currentRole === 'referee') {
                        window.location.href = window.location.origin + '/referee/dashboard.html';
                    }
                }
            },

            getCurrentUser() {
                return {
                    uid: sessionStorage.getItem('userId'),
                    role: sessionStorage.getItem('userRole'),
                    teamId: sessionStorage.getItem('teamId')
                };
            }
        };

        // Make functions global
        window.switchTab = function (tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tab === 'admin') {
                document.getElementById('tabBtnAdmin').classList.add('active');
                document.getElementById('adminTab').classList.add('active');
            } else if (tab === 'team') {
                document.getElementById('tabBtnTeam').classList.add('active');
                document.getElementById('teamTab').classList.add('active');
            } else if (tab === 'referee') {
                document.getElementById('tabBtnReferee').classList.add('active');
                document.getElementById('refereeTab').classList.add('active');
            }
        };

        window.loginAdmin = async function (event) {
            event.preventDefault();
            
            if (!RATE_LIMITER.checkLimit()) {
                alert('Too many failed attempts. Please try again in 60 seconds.');
                return;
            }

            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            try {
                UI.showLoading('Logging in...');
                const result = await AUTH_MANAGER.loginAdmin(email, password);
                UI.hideLoading();

                if (result.success) {
                    RATE_LIMITER.reset();
                    window.location.href = window.location.origin + '/admin/dashboard.html';
                }
            } catch (error) {
                UI.hideLoading();
                const status = RATE_LIMITER.recordFailure();
                if (status.locked) {
                    setTimeout(() => alert('Too many failed attempts. Please try again in 60 seconds.'), 10);
                } else {
                    alert(`Invalid username or password. Attempts remaining: ${status.remaining}`);
                }
            }
        };

        window.loginTeam = async function (event) {
            event.preventDefault();
            
            if (!RATE_LIMITER.checkLimit()) {
                alert('Too many failed attempts. Please try again in 60 seconds.');
                return;
            }

            const username = document.getElementById('teamUsername').value.trim();
            const password = document.getElementById('teamPassword').value.trim();

            if (!username || !password) {
                alert('❌ Please enter username and password');
                return;
            }

            try {
                UI.showLoading('Logging in...');
                const result = await AUTH_MANAGER.loginTeam(username, password);
                UI.hideLoading();

                if (result.success) {
                    RATE_LIMITER.reset();
                    window.location.href = window.location.origin + '/team/dashboard.html';
                }
            } catch (error) {
                UI.hideLoading();
                const status = RATE_LIMITER.recordFailure();
                if (status.locked) {
                    setTimeout(() => alert('Too many failed attempts. Please try again in 60 seconds.'), 10);
                } else {
                    alert(`Invalid username or password. Attempts remaining: ${status.remaining}`);
                }
            }
        };

        window.loginReferee = async function (event) {
            event.preventDefault();
            
            if (!RATE_LIMITER.checkLimit()) {
                alert('Too many failed attempts. Please try again in 60 seconds.');
                return;
            }

            const refId = document.getElementById('refereeId').value.trim();
            const password = document.getElementById('refereePassword').value.trim();

            if (!refId || !password) {
                alert('❌ Please enter Referee ID and password');
                return;
            }

            try {
                UI.showLoading('Logging in...');

                // Fetch referee data from Firebase directly (no auth module loaded yet)
                const snap = await get(ref(database, `referees/${refId}`));
                if (!snap.exists()) throw new Error('Invalid referee ID or password');

                const data = snap.val();
                const hashedRefInput = await hashPassword(password);
                const storedRefPw = data.password;
                if (isLegacyPassword(storedRefPw)) {
                    if (storedRefPw !== password) throw new Error('Invalid referee ID or password');
                    try { await update(ref(database, `referees/${refId}`), { password: hashedRefInput }); } catch (_) {}
                } else {
                    if (storedRefPw !== hashedRefInput) throw new Error('Invalid referee ID or password');
                }

                // Set session
                sessionStorage.setItem('userRole', 'referee');
                sessionStorage.setItem('userId', refId);
                sessionStorage.setItem('refId', refId);
                sessionStorage.setItem('courtNumber', data.courtNumber || '');
                
                // Store login page URL for logout redirect
                sessionStorage.setItem('loginPageUrl', window.location.href);

                // Sync users/{refId}
                await set(ref(database, `users/${refId}`), {
                    role: 'referee',
                    refId: refId,
                    courtNumber: data.courtNumber || '',
                    updatedAt: new Date().toISOString()
                });

                UI.hideLoading();
                RATE_LIMITER.reset();
                window.location.href = window.location.origin + '/referee/dashboard.html';
            } catch (error) {
                UI.hideLoading();
                const status = RATE_LIMITER.recordFailure();
                if (status.locked) {
                    setTimeout(() => alert('Too many failed attempts. Please try again in 60 seconds.'), 10);
                } else {
                    alert(`Invalid username or password. Attempts remaining: ${status.remaining}`);
                }
            }
        };
    </script>
</body>

</html>
