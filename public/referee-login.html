<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referee Login - Taekwondo Championship</title>
    <!-- Favicon - Multiple sizes for better visibility -->
    <link rel="icon" type="image/jpeg" href="/assets/images/favicon.jpeg" sizes="any">
    <link rel="apple-touch-icon" href="/assets/images/favicon.jpeg">
    <meta name="theme-color" content="#FFD700">
    <meta name="description" content="Referee login for the Taekwondo Championship Manager — Manage live matches and scores.">
    <!-- Resource hints for faster CDN loading -->
    <link rel="preconnect" href="https://taekowndo-championship-default-rtdb.asia-southeast1.firebasedatabase.app">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://firebase.googleapis.com">
    <link rel="dns-prefetch" href="https://taekowndo-championship-default-rtdb.asia-southeast1.firebasedatabase.app">
    <!-- Preload critical resources -->
    <link rel="preload" as="style" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script src="/js/history-protection.js"></script>
    <style>
        body {
            background-image: url('/assets/images/tkd-background_3_optimized_500.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .pw-wrap {
            position: relative
        }

        .pw-wrap input {
            padding-right: 44px
        }

        .pw-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: color .2s
        }

        .pw-toggle:hover {
            color: #FFD700
        }

        /* ── Toast Notification ─────────────────────────────── */
        .login-toast-overlay {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: center;
            z-index: 10000;
            padding: 20px 16px 0;
            pointer-events: none;
        }
        .login-toast {
            pointer-events: auto;
            min-width: 320px;
            max-width: 440px;
            width: 100%;
            padding: 16px 18px;
            border-radius: 16px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 8px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.05) inset;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            color: #fff;
            transform: translateY(-120%);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .login-toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .login-toast.error {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.92), rgba(153, 27, 27, 0.88));
            border: 1px solid rgba(252, 165, 165, 0.25);
        }
        .login-toast.warning {
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.92), rgba(180, 83, 9, 0.88));
            border: 1px solid rgba(253, 230, 138, 0.25);
        }
        .login-toast.info {
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.92), rgba(29, 78, 216, 0.88));
            border: 1px solid rgba(147, 197, 253, 0.25);
        }
        .login-toast-icon {
            font-size: 1.5rem;
            line-height: 1;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }
        .login-toast-body { flex: 1; min-width: 0; }
        .login-toast-title {
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.01em;
            margin-bottom: 3px;
        }
        .login-toast-msg {
            font-size: 0.85rem;
            opacity: 0.92;
            line-height: 1.4;
        }
        .login-toast-close {
            background: rgba(255,255,255,0.12);
            border: none;
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 7px;
            border-radius: 8px;
            line-height: 1;
            flex-shrink: 0;
            transition: background 0.2s, color 0.2s;
            margin-top: 1px;
        }
        .login-toast-close:hover {
            background: rgba(255,255,255,0.25);
            color: #fff;
        }
        .login-toast-progress {
            position: absolute;
            bottom: 0; left: 0;
            height: 3px;
            border-radius: 0 0 16px 16px;
            background: rgba(255,255,255,0.35);
        }
        .login-toast-progress.animate {
            animation: toastCountdown 4s linear forwards;
        }
        @keyframes toastCountdown {
            from { width: 100%; }
            to   { width: 0%; }
        }
        @keyframes toastShake {
            0%, 100% { transform: translateX(0); }
            20%  { transform: translateX(-6px); }
            40%  { transform: translateX(5px); }
            60%  { transform: translateX(-4px); }
            80%  { transform: translateX(2px); }
        }
        .login-toast.shake { animation: toastShake 0.45s ease-in-out; }
    </style>
    <!-- Password visibility toggle - defined in head to ensure availability before form renders -->
    <script>
        function togglePw(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const wasDisabled = input.disabled;
            if (wasDisabled) input.disabled = false;
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            if (wasDisabled) input.disabled = true;
            const eyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            const eyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            btn.innerHTML = isHidden ? eyeClosed : eyeOpen;
        }
    </script>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🥋 TAEKWONDO<br>CHAMPIONSHIP<br>MANAGER</h1>
            <p style="color: #00E5FF; font-size: 1.3rem; margin-top: 15px; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);">
                Referee Login</p>
        </div>

        <!-- Referee Login Form (Full Width) -->
        <div class="section">
            <form id="refereeLoginForm" onsubmit="loginReferee(event)">
                <div class="form-group">
                    <label for="refereeId">Referee ID</label>
                    <input type="text" id="refereeId" required placeholder="e.g. REF001">
                </div>
                <div class="form-group">
                    <label for="refereePassword">Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="refereePassword" required placeholder="Enter password">
                        <button type="button" class="pw-toggle" onclick="togglePw('refereePassword',this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Login as Referee</button>
            </form>
        </div>

        <div class="site-credit-footer">
            <span class="credit-line">© Karnataka Taekwondo Association &reg;</span>
            <span class="credit-line credit-address"># 54/1, 13th 'E' Cross, 7th Main, Rajajinagar Industrial Town, A.D. Halli, Bangalore-560 079</span>
            <span class="credit-line credit-owner">Built and Developed by Karnataka Taekwondo Association &reg;</span>
        </div>
    </div>


    <!-- Firebase SDK v11 -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
        import { getAuth, setPersistence, browserSessionPersistence, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
        import { getDatabase, ref, set, get, update, remove, onValue, push, query, orderByChild, equalTo, child } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js';
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js';
        import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';

        // ── PASSWORD HASHING ────────────────────────────────────────────────
        async function hashPassword(plain) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('TKDCM:' + plain));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        function isLegacyPassword(stored) { return !/^[0-9a-f]{64}$/.test(stored); }

        const firebaseConfig = {
            apiKey: "AIzaSyC7NfS7RMv8C78KGJsPkQCeV9fzmJ86lDU",
            authDomain: "taekowndo-championship.firebaseapp.com",
            databaseURL: "https://taekowndo-championship-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "taekowndo-championship",
            storageBucket: "taekowndo-championship.firebasestorage.app",
            messagingSenderId: "747830683087",
            appId: "1:747830683087:web:3a7461d1a54d475f1cdeba"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const storage = getStorage(app);
        const firestore = getFirestore(app);

        // ── Tab-scoped auth session (multi-tab fix) ───────────────────────
        // See public/js/firebase.js for the full rationale: this keeps this
        // tab's anonymous referee sign-in from bleeding into (or being
        // overwritten by) any other open tab logged in under a different role.
        const authReady = setPersistence(auth, browserSessionPersistence).catch((err) => {
          console.error('⚠️ Failed to set tab-scoped auth persistence:', err);
        });

        // Export for global use
        window.firebaseApp = app;
        window.auth = auth;
        window.database = database;
        window.storage = storage;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbGet = get;
        window.dbUpdate = update;
        window.dbRemove = remove;
        window.dbOnValue = onValue;
        window.dbPush = push;
        window.dbQuery = query;
        window.dbOrderByChild = orderByChild;
        window.dbEqualTo = equalTo;
        window.dbChild = child;
        window.storageRef = storageRef;
        window.uploadBytes = uploadBytes;
        window.getDownloadURL = getDownloadURL;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;

        console.log("✅ Firebase v11 initialized successfully");

        // UI HELPER
        window.UI = {
            showLoading(message = 'Loading...') {
                const existing = document.getElementById('loadingOverlay');
                if (existing) existing.remove();

                const overlay = document.createElement('div');
                overlay.id = 'loadingOverlay';
                overlay.className = 'loading-overlay';
                overlay.innerHTML = `
                    <div class="loading-spinner">
                        <div class="spinner"></div>
                        <p>${message}</p>
                    </div>
                `;
                document.body.appendChild(overlay);
            },

            hideLoading() {
                const overlay = document.getElementById('loadingOverlay');
                if (overlay) overlay.remove();
            }
        };

        // SECURE LOGIN ATTEMPT PROTECTION
        // Uses role-specific localStorage key so referee login failures
        // never affect rate limiting for other roles or tabs.
        window.RATE_LIMITER = {
            maxAttempts: 3,
            lockTime: 60 * 1000,
            storageKey: 'loginAttempts_referee',
            
            checkLimit() {
                const stored = localStorage.getItem(this.storageKey);
                if (stored) {
                    const data = JSON.parse(stored);
                    if (data.lockedUntil && Date.now() < data.lockedUntil) {
                        this.enforceLock(data.lockedUntil);
                        return false; 
                    } else if (data.lockedUntil && Date.now() >= data.lockedUntil) {
                        localStorage.removeItem(this.storageKey);
                        return true;
                    }
                }
                return true; 
            },
            
            recordFailure() {
                let data = { attempts: 0, lockedUntil: null };
                const stored = localStorage.getItem(this.storageKey);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (!parsed.lockedUntil || Date.now() >= parsed.lockedUntil) {
                        data = parsed;
                    }
                }
                
                data.attempts += 1;
                
                if (data.attempts >= this.maxAttempts) {
                    data.lockedUntil = Date.now() + this.lockTime;
                    localStorage.setItem(this.storageKey, JSON.stringify(data));
                    this.enforceLock(data.lockedUntil);
                    return { locked: true, remaining: 0 };
                }
                
                localStorage.setItem(this.storageKey, JSON.stringify(data));
                return { locked: false, remaining: this.maxAttempts - data.attempts };
            },
            
            reset() {
                localStorage.removeItem(this.storageKey);
            },
            
            enforceLock(lockedUntil) {
                const buttons = document.querySelectorAll('button[type="submit"]');
                const inputs = document.querySelectorAll('input');
                
                buttons.forEach(btn => {
                    if (!btn.dataset.originalText) btn.dataset.originalText = btn.innerText;
                    btn.disabled = true;
                });
                inputs.forEach(input => input.disabled = true);
                
                const self = this;
                const updateTimer = () => {
                    const remaining = Math.ceil((lockedUntil - Date.now()) / 1000);
                    if (remaining <= 0) {
                        buttons.forEach(btn => {
                            btn.disabled = false;
                            btn.innerText = btn.dataset.originalText;
                        });
                        inputs.forEach(input => input.disabled = false);
                        localStorage.removeItem(self.storageKey);
                    } else {
                        buttons.forEach(btn => btn.innerText = `Try again in ${remaining}s`);
                        setTimeout(updateTimer, 1000);
                    }
                };
                updateTimer();
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            RATE_LIMITER.checkLimit();
        });

        // ── Toast Notification Helper ──────────────────────────────────
        window.showToast = function(message, type = 'error') {
            const existing = document.querySelector('.login-toast-overlay');
            if (existing) existing.remove();

            const icons  = { error: '🚫', warning: '⚠️', info: '💡' };
            const titles = { error: 'Login Failed', warning: 'Account Locked', info: 'Notice' };

            const overlay = document.createElement('div');
            overlay.className = 'login-toast-overlay';
            overlay.innerHTML = `
                <div class="login-toast ${type}">
                    <span class="login-toast-icon">${icons[type] || icons.error}</span>
                    <div class="login-toast-body">
                        <div class="login-toast-title">${titles[type] || titles.error}</div>
                        <div class="login-toast-msg">${message}</div>
                    </div>
                    <button class="login-toast-close" onclick="this.closest('.login-toast-overlay').remove()">✕</button>
                    <div class="login-toast-progress"></div>
                </div>
            `;
            document.body.appendChild(overlay);

            const toast = overlay.querySelector('.login-toast');
            requestAnimationFrame(() => {
                toast.classList.add('show');
                if (type === 'error') toast.classList.add('shake');
                overlay.querySelector('.login-toast-progress').classList.add('animate');
            });

            const autoClose = setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => overlay.remove(), 500);
            }, 4000);

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    clearTimeout(autoClose);
                    toast.classList.remove('show');
                    setTimeout(() => overlay.remove(), 500);
                }
            });
        };

        // Make functions global
        window.loginReferee = async function (event) {
            event.preventDefault();
            
            if (!RATE_LIMITER.checkLimit()) {
                showToast('Too many failed attempts. Please try again in 60 seconds.', 'warning');
                return;
            }

            const refId = document.getElementById('refereeId').value.trim();
            const password = document.getElementById('refereePassword').value.trim();

            if (!refId || !password) {
                showToast('Please enter Referee ID and password.', 'info');
                return;
            }

            try {
                UI.showLoading('Logging in...');

                // Fetch referee data from Firebase directly
                const snap = await get(ref(database, `referees/${refId}`));
                if (!snap.exists()) throw new Error('Invalid referee ID or password');

                const data = snap.val();
                const hashedInput = await hashPassword(password);
                const storedPw = data.password;
                if (isLegacyPassword(storedPw)) {
                    if (storedPw !== password) throw new Error('Invalid referee ID or password');
                    try { await update(ref(database, `referees/${refId}`), { password: hashedInput }); } catch (_) {}
                } else {
                    if (storedPw !== hashedInput) throw new Error('Invalid referee ID or password');
                }

                // Set session
                sessionStorage.setItem('userRole', 'referee');
                sessionStorage.setItem('userId', refId);
                sessionStorage.setItem('refId', refId);
                sessionStorage.setItem('courtNumber', data.courtNumber || '');

                // Store login page URL for logout redirect
                sessionStorage.setItem('loginPageUrl', window.location.href);

                // Sync users/{refId}
                await set(ref(database, `users/${refId}`), {
                    role: 'referee',
                    refId: refId,
                    courtNumber: data.courtNumber || '',
                    updatedAt: new Date().toISOString()
                });

                // Sign in anonymously to Firebase Auth so RTDB/Firestore security
                // rules can identify this referee. The anonymous UID is stable per browser.
                try {
                    await authReady;
                    const anonResult = await signInAnonymously(auth);
                    const anonUid = anonResult.user.uid;
                    sessionStorage.setItem('firebaseUid', anonUid);

                    // Write users/{anonUid} so RTDB rules (which check
                    // root.child('users').child(auth.uid).child('role')) can resolve
                    // this referee's role — auth.uid is the anonymous uid, NOT refId,
                    // so this is a separate record from users/{refId} written above.
                    await set(ref(database, `users/${anonUid}`), {
                        role: 'referee',
                        refId: refId,
                        courtNumber: data.courtNumber || '',
                        updatedAt: new Date().toISOString()
                    });

                    // Write userRoles doc so Firestore rules can resolve role + court
                    await setDoc(doc(firestore, 'userRoles', anonUid), {
                        role: 'referee',
                        refId: refId,
                        courtNumber: data.courtNumber || '',
                        createdAt: serverTimestamp()
                    }, { merge: true });
                } catch (fsErr) {
                    // Non-fatal: messaging won't work but login still succeeds
                    console.warn('Anonymous auth / Firestore init failed:', fsErr.message);
                }

                UI.hideLoading();
                RATE_LIMITER.reset();
                window.location.href = window.location.origin + '/referee/dashboard.html';
            } catch (error) {
                UI.hideLoading();
                const status = RATE_LIMITER.recordFailure();
                if (status.locked) {
                    setTimeout(() => showToast('Too many failed attempts. Please try again in 60 seconds.', 'warning'), 10);
                } else {
                    showToast(`Invalid credentials. ${status.remaining} attempt${status.remaining !== 1 ? 's' : ''} remaining.`, 'error');
                }
            }
        };
    </script>
</body>
