<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Registration - Taekwondo Championship</title>
    <!-- Favicon - Multiple sizes for better visibility -->
    <link rel="icon" type="image/jpeg" href="/assets/images/favicon.jpeg" sizes="any">
    <link rel="apple-touch-icon" href="/assets/images/favicon.jpeg">
    <meta name="theme-color" content="#FFD700">
    <meta name="description" content="Player registration form for the Taekwondo Championship — register athletes with their details, weight category, and contact information.">

    <!-- PAGE PROTECTION: Must run FIRST before anything else -->
    <script>
        (function() {
            var role = sessionStorage.getItem('userRole');
            if (role !== 'team') {
                window.location.replace('/index.html');
            }
        })();
    </script>

    <link rel="preconnect" href="https://taekowndo-championship-default-rtdb.asia-southeast1.firebasedatabase.app">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="dns-prefetch" href="https://taekowndo-championship-default-rtdb.asia-southeast1.firebasedatabase.app">
    <link rel="preload" as="style" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script defer src="/js/modal.js"></script>
    <script src="/js/history-protection.js"></script>
    <script src="/js/image-optimizer.js"></script>
</head>
<body>
    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px">
        <button class="btn-secondary" onclick="window.location.href='/team/dashboard.html'">← Back to Dashboard</button>
        <button class="btn-danger" onclick="UI.logout()">Logout</button>
    </div>

    <div class="container">
        <!-- Championship Header (Dynamic) -->
        <div id="championshipHeader"></div>

        <!-- Registration Form -->
        <div class="section">
            <h2 style="text-align: center; margin-bottom: 30px;">Player Registration Form</h2>
            <form id="registrationForm">
                <!-- Form fields will be dynamically generated here -->
            </form>
        </div>
    </div>

    <div class="site-credit-footer">
        <span class="credit-line">© Karnataka Taekwondo Association</span>
        <span class="credit-line credit-owner">Built and Developed by Chiranandan T M</span>
        <span class="credit-line credit-supporter">Co-Supporter: Sharan B N</span>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="/js/firebase.js"></script>
    <script type="module" src="/js/performance-cache.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script type="module" src="/js/form-config.js"></script>
    <script type="module" src="/js/category-logic.js"></script>
    <script type="module" src="/js/registration.js"></script>
    <script src="/js/custom-select.js"></script>
</body>
</html>
