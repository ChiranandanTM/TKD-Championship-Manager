<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Dashboard - Taekwondo Championship</title>
        <!-- PAGE PROTECTION -->
    <!-- Favicon - Multiple sizes for better visibility -->
    <link rel="icon" type="image/jpeg" href="/assets/images/favicon.jpeg" sizes="any">
    <link rel="apple-touch-icon" href="/assets/images/favicon.jpeg">
    <meta name="theme-color" content="#FFD700">
    <script>
        (function() {
            var role = sessionStorage.getItem('userRole');
            if (role !== 'team') {
                window.location.replace('/index.html');
            }
        })();
    </script>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preload" as="style" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script defer src="/js/modal.js"></script>
    <style>
        @keyframes tdSpin{to{transform:rotate(360deg)}}
        @keyframes tdPulse{0%,100%{opacity:.5}50%{opacity:.2}}
        @keyframes tdFadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

        /* Skeleton loader */
        .td-skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:tdPulse 1.5s ease-in-out infinite;border-radius:12px;min-height:120px}
        .td-loading{display:flex;align-items:center;gap:12px;padding:28px 0;color:#555;font-size:.95rem}
        .td-spinner{width:26px;height:26px;border:3px solid rgba(255,215,0,.25);border-top-color:#FFD700;border-radius:50%;animation:tdSpin .8s linear infinite;flex-shrink:0}

        /* Summary cards row */
        .td-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
        .td-stat{border-radius:20px;padding:26px 22px;text-align:center;position:relative;overflow:hidden;transition:transform .25s,box-shadow .3s}
        .td-stat:hover{transform:translateY(-5px);box-shadow:0 20px 50px rgba(0,0,0,.5)}
        .td-stat::before{content:'';position:absolute;top:-35%;right:-15%;width:120px;height:120px;border-radius:50%;opacity:.13}
        /* Card colour variants */
        .td-stat-1{background:linear-gradient(135deg,#0d47a1,#1565c0);border:1.5px solid rgba(66,165,245,.35)}
        .td-stat-1::before{background:#42a5f5}
        .td-stat-1 .td-stat-val{color:#64b5f6}
        .td-stat-2{background:linear-gradient(135deg,#1b5e20,#2e7d32);border:1.5px solid rgba(102,187,106,.35)}
        .td-stat-2::before{background:#66bb6a}
        .td-stat-2 .td-stat-val{color:#81c784}
        .td-stat-3{background:linear-gradient(135deg,#4a148c,#6a1b9a);border:1.5px solid rgba(186,104,200,.35)}
        .td-stat-3::before{background:#ba68c8}
        .td-stat-3 .td-stat-val{color:#ce93d8}
        .td-stat-4{background:linear-gradient(135deg,#004d40,#00695c);border:1.5px solid rgba(77,182,172,.35)}
        .td-stat-4::before{background:#4db6ac}
        .td-stat-4 .td-stat-val{color:#4db6ac}
        .td-stat-icon{font-size:2rem;margin-bottom:8px;display:block}
        .td-stat-val{font-size:2.4rem;font-weight:900;line-height:1.1;letter-spacing:-1px}
        .td-stat-lbl{font-size:.68rem;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:1.1px;margin-top:6px;font-weight:700}

        /* Search bar */
        .td-search{width:100%;box-sizing:border-box;padding:12px 18px 12px 16px;background:rgba(0,0,0,.45);border:2px solid rgba(255,215,0,.25);border-radius:12px;color:#fff;font-size:.95rem;font-weight:500;transition:border-color .2s,box-shadow .2s;outline:none}
        .td-search:focus{border-color:#FFD700;box-shadow:0 0 0 3px rgba(255,215,0,.12)}
        .td-search::placeholder{color:#666}
        .td-search-wrap{position:relative;min-width:200px}

        /* Filters row */
        .td-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding:16px 20px;background:rgba(0,229,255,.03);border:1.5px solid rgba(0,229,255,.12);border-radius:14px}
        .td-flbl{font-size:.78rem;color:#00E5FF;font-weight:700;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}

        /* Player grid */
        .player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;margin-top:20px}

        /* Player card */
        .player-card{background:linear-gradient(150deg,rgba(14,18,42,.98),rgba(22,32,62,.96));border:2px solid rgba(255,215,0,.2);border-radius:20px;padding:22px;text-align:center;transition:transform .25s,box-shadow .25s,border-color .3s;animation:tdFadeUp .35s ease;overflow:hidden;position:relative}
        .player-card:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(255,215,0,.12);border-color:rgba(255,215,0,.45)}

        .player-image{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,215,0,.5);margin-bottom:12px;transition:border-color .3s,box-shadow .3s}
        .player-card:hover .player-image{border-color:#FFD700;box-shadow:0 0 20px rgba(255,215,0,.2)}

        .player-info{text-align:left;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
        .player-info-row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:.88rem}
        .player-info-label{color:#6a7fa8;font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
        .player-info-value{color:#e8ecf2;font-weight:700;font-size:.88rem}
        /* Coloured value chips */
        .td-val-gender-m{background:rgba(66,165,245,.12);color:#64b5f6;padding:2px 10px;border-radius:20px;font-size:.78rem;font-weight:700}
        .td-val-gender-f{background:rgba(236,64,122,.12);color:#f48fb1;padding:2px 10px;border-radius:20px;font-size:.78rem;font-weight:700}
        .td-val-weight{color:#ffb74d;font-weight:800}
        .td-val-cat{background:rgba(186,104,200,.12);color:#ce93d8;padding:2px 9px;border-radius:8px;font-size:.76rem;font-weight:700}
        .td-val-paid{background:rgba(102,187,106,.1);color:#81c784;padding:2px 9px;border-radius:8px;font-size:.76rem;font-weight:700}
        .td-val-unpaid{background:rgba(255,23,68,.1);color:#ef9a9a;padding:2px 9px;border-radius:8px;font-size:.76rem;font-weight:700}
        .td-val-center{color:#80cbc4;font-weight:700}

        /* Badges */
        .status-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:.78rem;font-weight:800;margin-top:10px}
        .status-pending{background:rgba(255,152,0,.15);color:#FF9800;border:1.5px solid #FF9800}
        .status-approved{background:rgba(0,230,118,.12);color:#00E676;border:1.5px solid #00E676}

        .card-badge-row{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
        .card-badge-row .status-badge{margin-top:0}

        .medal-badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:.78rem;font-weight:800;letter-spacing:.2px;text-transform:uppercase;border:1.5px solid transparent}
        .medal-gold{background:linear-gradient(135deg,#FFD700,#FFC107);color:#1f1a00;border-color:#B8860B}
        .medal-silver{background:linear-gradient(135deg,#E5E7EB,#C0C4CC);color:#1f2937;border-color:#9CA3AF}
        .medal-bronze{background:linear-gradient(135deg,#CD7F32,#A0522D);color:#fff6ee;border-color:#7A3E14}

        /* Filter buttons */
        .medal-filter-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
        .medal-filter-label{color:var(--text-gray);font-size:.95rem;font-weight:700}
        .medal-filter-btn{border:2px solid rgba(255,215,0,.3);background:rgba(0,0,0,.3);color:#aaa;border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s}
        .medal-filter-btn:hover{transform:translateY(-1px);border-color:rgba(255,215,0,.6);color:#fff}
        .medal-filter-btn.active{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;border-color:#FFD700}

        .category-filter-select{border:2px solid rgba(255,215,0,.3);background:rgba(0,0,0,.4);color:#fff;border-radius:10px;padding:7px 12px;font-size:.88rem;font-weight:700;min-width:160px;outline:none;transition:border-color .2s}
        .category-filter-select:focus{box-shadow:0 0 0 2px rgba(0,229,255,.25);border-color:#00E5FF}
        .category-filter-select option{background:#0a0e2a;color:#fff}

        /* Action buttons on card */
        .td-card-actions{display:flex;gap:8px;margin-top:14px}
        .td-btn-edit{flex:1;padding:10px;background:rgba(0,229,255,.08);border:2px solid #00E5FF;border-radius:10px;color:#00E5FF;font-weight:800;font-size:.85rem;cursor:pointer;transition:all .2s}
        .td-btn-edit:hover{background:rgba(0,229,255,.18);transform:translateY(-1px)}
        .td-btn-del{padding:10px 14px;background:rgba(255,23,68,.08);border:2px solid rgba(255,23,68,.3);border-radius:10px;color:#ff6b6b;font-weight:700;font-size:.85rem;cursor:pointer;transition:all .2s}
        .td-btn-del:hover{border-color:#FF1744;color:#FF1744;background:rgba(255,23,68,.15)}

        /* Empty state */
        .td-empty{text-align:center;padding:60px 20px;border:2px dashed rgba(255,255,255,.07);border-radius:18px}
        .td-empty-icon{font-size:3.5rem;margin-bottom:14px}
        .td-empty-title{font-size:1.1rem;font-weight:700;color:#666;margin-bottom:6px}
        .td-empty-sub{font-size:.88rem;color:#444}

        /* Registration status banner */
        .td-reg-banner{padding:14px 20px;border-radius:14px;font-weight:700;font-size:.9rem;margin-bottom:20px;display:flex;align-items:center;gap:12px}
        .td-reg-open{background:rgba(0,230,118,.08);border:1.5px solid rgba(0,230,118,.3);color:#00E676}
        .td-reg-closed{background:rgba(255,23,68,.08);border:1.5px solid rgba(255,23,68,.3);color:#FF1744}

        /* Player count pill */
        .td-count-pill{background:rgba(255,215,0,.1);border:1.5px solid rgba(255,215,0,.3);color:#FFD700;padding:4px 14px;border-radius:20px;font-size:.82rem;font-weight:800;white-space:nowrap}

    </style>
</head>
<body>
    <div class="page-header">
        <h1 class="page-title" id="teamTitle">👥 TEAM DASHBOARD</h1>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <button class="btn-primary" id="registerBtn" onclick="window.location.href='/register.html'" style="padding:10px 22px;border-radius:10px;font-weight:800">➕ Register Player</button>
            <button class="btn-danger" onclick="UI.logout()" style="padding:10px 18px;border-radius:10px;font-weight:700">Logout</button>
        </div>
    </div>

    <div class="container">
        <!-- Registration Status Banner -->
        <div id="regBanner"></div>

        <!-- Summary Cards -->
        <div id="teamInfo">
            <div class="td-summary">
                <div class="td-skeleton" style="min-height:100px"></div>
                <div class="td-skeleton" style="min-height:100px"></div>
                <div class="td-skeleton" style="min-height:100px"></div>
                <div class="td-skeleton" style="min-height:100px"></div>
            </div>
        </div>

        <!-- Players Section -->
        <div class="section">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px">
                <div style="display:flex;align-items:center;gap:12px">
                    <h2 style="margin:0">Your Players</h2>
                    <span class="td-count-pill" id="playerCountPill">0 players</span>
                </div>
            </div>

            <!-- Search -->
            <div class="td-search-wrap" style="margin-bottom:16px">
                <input type="text" class="td-search" id="playerSearch" placeholder="Search players by name…" oninput="window.searchPlayers(this.value)">
            </div>

            <!-- Filters -->
            <div class="td-filters">
                <span class="td-flbl">Medal:</span>
                <button class="medal-filter-btn active" data-medal-filter="all" onclick="setMedalFilter('all')">All</button>
                <button class="medal-filter-btn" data-medal-filter="Gold" onclick="setMedalFilter('Gold')">🥇 Gold</button>
                <button class="medal-filter-btn" data-medal-filter="Silver" onclick="setMedalFilter('Silver')">🥈 Silver</button>
                <button class="medal-filter-btn" data-medal-filter="Bronze" onclick="setMedalFilter('Bronze')">🥉 Bronze</button>
                <span class="td-flbl" style="margin-left:8px">Category:</span>
                <select id="ageCategoryFilter" class="category-filter-select" onchange="setAgeCategoryFilter(this.value)">
                    <option value="all">All Categories</option>
                </select>
            </div>

            <div id="playersList" class="player-grid">
                <div class="td-skeleton" style="min-height:300px"></div>
                <div class="td-skeleton" style="min-height:300px"></div>
                <div class="td-skeleton" style="min-height:300px"></div>
            </div>
        </div>
    </div>

    <div class="site-credit-footer">
        <span class="credit-line">© Karnataka Taekwondo Association</span>
        <span class="credit-line credit-owner">Built and Developed by Chiranandan T M</span>
        <span class="credit-line credit-supporter">Co-Supporter: Sharan B N</span>
    </div>

    <!-- Firebase SDK v9 -->
    <script type="module" src="/js/firebase.js"></script>
    <script type="module" src="/js/performance-cache.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script type="module" src="/js/player-manager.js"></script>

    <script type="module">
        let teamPlayers = [];
        let currentMedalFilter = 'all';
        let currentAgeCategoryFilter = 'all';

        const MEDAL_PRIORITY = {
            Bronze: 1,
            Silver: 2,
            Gold: 3
        };

        function toOrderedArray(value) {
            if (!value) return [];
            if (Array.isArray(value)) return value;
            return Object.keys(value)
                .sort((a, b) => Number(a) - Number(b))
                .map(key => value[key]);
        }

        function setBestMedal(map, playerId, medalType) {
            if (!playerId || !medalType || !MEDAL_PRIORITY[medalType]) return;
            const current = map[playerId];
            if (!current || MEDAL_PRIORITY[medalType] > MEDAL_PRIORITY[current.type]) {
                map[playerId] = { type: medalType };
            }
        }

        function buildMedalMapFromBrackets(bracketsData) {
            const medalMap = {};
            if (!bracketsData || typeof bracketsData !== 'object') {
                return medalMap;
            }

            Object.values(bracketsData).forEach(bracket => {
                if (!bracket || !bracket.rounds) return;

                const rounds = toOrderedArray(bracket.rounds).map(round => toOrderedArray(round));
                if (rounds.length === 0) return;

                // Final round: champion + runner-up
                const finalRound = rounds[rounds.length - 1] || [];
                const finalMatch = finalRound[0];
                if (finalMatch && finalMatch.status === 'completed' && finalMatch.winner) {
                    const p1 = finalMatch.player1 || null;
                    const p2 = finalMatch.player2 || null;
                    const championId = finalMatch.winner;
                    const runnerUpId = p1 && p1.id === championId ? (p2 && p2.id) : (p1 && p1.id);

                    setBestMedal(medalMap, championId, 'Gold');
                    setBestMedal(medalMap, runnerUpId, 'Silver');
                }

                // Semi-final losers: bronze
                if (rounds.length >= 2) {
                    const semiFinalRound = rounds[rounds.length - 2] || [];
                    semiFinalRound.forEach(match => {
                        if (!match || match.status !== 'completed' || !match.eliminated) return;
                        setBestMedal(medalMap, match.eliminated, 'Bronze');
                    });
                }
            });

            return medalMap;
        }

        function getMedalBadgeHtml(medalType) {
            if (!medalType) return '';

            if (medalType === 'Gold') {
                return '<span class="medal-badge medal-gold">🥇 Gold</span>';
            }
            if (medalType === 'Silver') {
                return '<span class="medal-badge medal-silver">🥈 Silver</span>';
            }
            if (medalType === 'Bronze') {
                return '<span class="medal-badge medal-bronze">🥉 Bronze</span>';
            }

            return '';
        }

        function updateMedalFilterButtons() {
            document.querySelectorAll('[data-medal-filter]').forEach(btn => {
                const isActive = btn.getAttribute('data-medal-filter') === currentMedalFilter;
                btn.classList.toggle('active', isActive);
            });
        }

        function getPlayerAgeCategory(player) {
            return String(player?.ageCategory || '').trim() || 'Unknown';
        }

        function getAgeCategorySortRank(category) {
            const sortOrder = {
                Mini: 1,
                'Sub-Junior': 2,
                Cadet: 3,
                Junior: 4,
                Senior: 5,
                Unknown: 99
            };
            return sortOrder[category] || 50;
        }

        function populateAgeCategoryFilterOptions() {
            const filterSelect = document.getElementById('ageCategoryFilter');
            if (!filterSelect) return;

            const uniqueCategories = [...new Set(teamPlayers.map(getPlayerAgeCategory))]
                .sort((a, b) => {
                    const rankA = getAgeCategorySortRank(a);
                    const rankB = getAgeCategorySortRank(b);
                    if (rankA !== rankB) return rankA - rankB;
                    return a.localeCompare(b);
                });

            filterSelect.innerHTML = '<option value="all">All Categories</option>';
            uniqueCategories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                filterSelect.appendChild(option);
            });

            const hasSelectedCategory = uniqueCategories.includes(currentAgeCategoryFilter);
            if (!hasSelectedCategory) {
                currentAgeCategoryFilter = 'all';
            }
            filterSelect.value = currentAgeCategoryFilter;
            filterSelect.disabled = teamPlayers.length === 0;
        }

        let currentSearchQuery = '';

        function renderPlayersList() {
            const playersList = document.getElementById('playersList');
            if (!playersList) return;

            const filteredPlayers = teamPlayers.filter(player => {
                const medalMatch = currentMedalFilter === 'all' || player.medalType === currentMedalFilter;
                const categoryMatch = currentAgeCategoryFilter === 'all' || getPlayerAgeCategory(player) === currentAgeCategoryFilter;
                const searchMatch = !currentSearchQuery || player.playerName.toLowerCase().includes(currentSearchQuery.toLowerCase());
                return medalMatch && categoryMatch && searchMatch;
            });

            // Update count pill
            const pill = document.getElementById('playerCountPill');
            if (pill) pill.textContent = `${filteredPlayers.length} player${filteredPlayers.length !== 1 ? 's' : ''}`;

            if (filteredPlayers.length === 0) {
                if (teamPlayers.length === 0) {
                    playersList.innerHTML = `<div class="td-empty" style="grid-column:1/-1"><div class="td-empty-icon">🥋</div><div class="td-empty-title">No players registered yet</div><div class="td-empty-sub">Click "Register Player" to add your first athlete</div></div>`;
                } else {
                    playersList.innerHTML = `<div class="td-empty" style="grid-column:1/-1"><div class="td-empty-icon">🔍</div><div class="td-empty-title">No matches found</div><div class="td-empty-sub">Try adjusting your filters or search</div></div>`;
                }
                return;
            }

            let html = '';
            filteredPlayers.forEach(player => {
                const medalBadgeHtml = getMedalBadgeHtml(player.medalType);
                const approvedBadgeHtml = player.status === 'approved'
                    ? '<span class="status-badge status-approved">✅ Approved</span>'
                    : '';
                const badgeRowHtml = (approvedBadgeHtml || medalBadgeHtml)
                    ? `<div class="card-badge-row">${approvedBadgeHtml}${medalBadgeHtml}</div>`
                    : '';
                const tn = (player.playerName || '').replace(/'/g, "\\'");

                html += `
                    <div class="player-card">
                        <img src="${player.playerImage}" alt="${player.playerName}" class="player-image">
                        <h3 style="color:#FFD700;margin:6px 0 2px;font-size:1.05rem;font-weight:900">${player.playerName}</h3>
                        <div style="font-size:.76rem;font-weight:700;letter-spacing:.5px">
                            <span class="td-val-cat">${player.ageCategory || 'N/A'}</span>
                            <span style="color:#555;margin:0 4px">·</span>
                            <span class="td-val-weight">${player.weightCategory || 'N/A'}</span>
                        </div>

                        <div class="player-info">
                            <div class="player-info-row"><span class="player-info-label">Gender</span><span class="${player.gender==='Male'?'td-val-gender-m':'td-val-gender-f'}">${player.gender}</span></div>
                            <div class="player-info-row"><span class="player-info-label">Age</span><span class="player-info-value">${player.age} yrs</span></div>
                            <div class="player-info-row"><span class="player-info-label">Weight</span><span class="td-val-weight">${player.weight} kg</span></div>
                            <div class="player-info-row"><span class="player-info-label">Center</span><span class="td-val-center">${player.centerName}</span></div>
                            <div class="player-info-row"><span class="player-info-label">Payment</span><span class="${player.paymentStatus==='Paid'?'td-val-paid':'td-val-unpaid'}">${player.paymentStatus==='Paid'?'✅ Paid':'❌ Unpaid'}</span></div>
                        </div>

                        ${badgeRowHtml}

                        <div class="td-card-actions">
                            <button class="td-btn-edit" onclick="editPlayer('${player.id}')">✏️ Edit</button>
                            <button class="td-btn-del" onclick="deletePlayer('${player.id}', '${tn}', '${player.teamId}')">🗑</button>
                        </div>
                    </div>
                `;
            });

            playersList.innerHTML = html;
        }

        async function loadTeamInfo() {
            const user = AUTH_MANAGER.getCurrentUser();
            const teamId = user.teamId;

            if (!teamId) {
                document.getElementById('teamInfo').innerHTML = '<p>Team information not found.</p>';
                return;
            }

            try {
                const teamRef = dbRef(database, `teams/${teamId}`);
                const snapshot = await dbGet(teamRef);

                if (snapshot.exists()) {
                    const team = snapshot.val();

                    // Update header with team name
                    const titleEl = document.getElementById('teamTitle');
                    if (titleEl) titleEl.textContent = `🥋 ${team.teamName}`;

                    // ── CHECK PER-TEAM DEADLINE / CLOSED STATUS ──────────────
                    const registerBtn = document.getElementById('registerBtn');
                    const now = new Date();
                    let registrationBlocked = false;
                    let blockedReason = '';

                    if (team.registrationClosed === true) {
                        registrationBlocked = true;
                        blockedReason = 'Registration closed by admin';
                    } else if (team.registrationDeadline) {
                        const dl = new Date(team.registrationDeadline);
                        dl.setHours(23, 59, 59, 999);
                        if (now > dl) {
                            registrationBlocked = true;
                            const fmt = new Date(team.registrationDeadline).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
                            blockedReason = `Deadline passed (${fmt})`;
                        }
                    }

                    // Registration banner
                    const banner = document.getElementById('regBanner');
                    if (banner) {
                        if (registrationBlocked) {
                            banner.innerHTML = `<div class="td-reg-banner td-reg-closed">🔒 ${blockedReason}. Contact the organizer for assistance.</div>`;
                        } else {
                            banner.innerHTML = `<div class="td-reg-banner td-reg-open">✅ Registration is open — you can register new players.</div>`;
                        }
                    }

                    if (registrationBlocked && registerBtn) {
                        registerBtn.disabled = true;
                        registerBtn.textContent = '🔒 Registration Closed';
                        registerBtn.title = blockedReason;
                        registerBtn.onclick = () => MODAL.showAlert(`🔒 Registration Closed\n\n${blockedReason}.\n\nPlease contact the organizer.`);
                        registerBtn.style.background = 'var(--accent-red)';
                        registerBtn.style.borderColor = 'var(--accent-red)';
                        registerBtn.style.color = 'var(--text-white)';
                        registerBtn.style.cursor = 'not-allowed';
                        registerBtn.style.opacity = '0.8';
                    }
                    // ────────────────────────────────────────────────────────

                    document.getElementById('teamInfo').innerHTML = `
                        <div class="td-summary">
                            <div class="td-stat td-stat-1">
                                <div class="td-stat-icon">🏅</div>
                                <div class="td-stat-val" style="font-size:1.15rem">${team.teamName}</div>
                                <div class="td-stat-lbl">Team Name</div>
                            </div>
                            <div class="td-stat td-stat-2">
                                <div class="td-stat-icon">👤</div>
                                <div class="td-stat-val" style="font-size:1.1rem">${team.username}</div>
                                <div class="td-stat-lbl">Username</div>
                            </div>
                            <div class="td-stat td-stat-3">
                                <div class="td-stat-icon">🥋</div>
                                <div class="td-stat-val" id="playerCount">0</div>
                                <div class="td-stat-lbl">Players</div>
                            </div>
                            <div class="td-stat td-stat-4">
                                <div class="td-stat-icon">${registrationBlocked ? '🔒' : '✅'}</div>
                                <div class="td-stat-val" style="font-size:1.05rem;color:${registrationBlocked ? '#ef9a9a' : '#4db6ac'}">${registrationBlocked ? 'Closed' : 'Open'}</div>
                                <div class="td-stat-lbl">Registration</div>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading team info:', error);
                const teamInfoEl = document.getElementById('teamInfo');
                if (teamInfoEl) {
                    teamInfoEl.innerHTML = `
                        <div style="padding:24px;background:rgba(255,23,68,.08);border:2px solid rgba(255,23,68,.3);border-radius:14px;text-align:center">
                            <div style="font-size:2rem;margin-bottom:8px">⚠️</div>
                            <div style="color:#ef9a9a;font-weight:700;margin-bottom:6px">Failed to load team info</div>
                            <div style="color:#666;font-size:.85rem;margin-bottom:14px">${error.message || 'Check your connection'}</div>
                            <button onclick="loadTeamInfo()" style="padding:10px 24px;background:rgba(255,215,0,.1);border:2px solid rgba(255,215,0,.4);border-radius:10px;color:#FFD700;font-weight:700;cursor:pointer">🔄 Retry</button>
                        </div>`;
                }
            }
        }

        async function loadPlayers() {
            const user = AUTH_MANAGER.getCurrentUser();
            const teamId = user.teamId;

            try {
                const playersRef = dbRef(database, 'players');
                const bracketsRef = dbRef(database, 'brackets');
                const [playersSnapshot, bracketsSnapshot] = await Promise.all([
                    dbGet(playersRef),
                    dbGet(bracketsRef)
                ]);

                const medalMap = bracketsSnapshot.exists()
                    ? buildMedalMapFromBrackets(bracketsSnapshot.val())
                    : {};

                if (!playersSnapshot.exists()) {
                    teamPlayers = [];
                    populateAgeCategoryFilterOptions();
                    renderPlayersList();
                    return;
                }

                const players = [];
                playersSnapshot.forEach(child => {
                    const player = child.val();
                    if (player.teamId === teamId) {
                        players.push({ id: child.key, ...player, medalType: medalMap[child.key]?.type || null });
                    }
                });

                document.getElementById('playerCount').textContent = players.length;

                if (players.length === 0) {
                    teamPlayers = [];
                    populateAgeCategoryFilterOptions();
                    renderPlayersList();
                    return;
                }

                // Sort by submission date
                players.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

                teamPlayers = players;
                populateAgeCategoryFilterOptions();
                renderPlayersList();

            } catch (error) {
                console.error('Error loading players:', error);
                const grid = document.getElementById('playersGrid');
                if (grid) {
                    grid.innerHTML = `
                        <div style="grid-column:1/-1;padding:40px 20px;background:rgba(255,23,68,.08);border:2px solid rgba(255,23,68,.3);border-radius:14px;text-align:center">
                            <div style="font-size:2.5rem;margin-bottom:10px">⚠️</div>
                            <div style="color:#ef9a9a;font-weight:700;font-size:1.05rem;margin-bottom:6px">Failed to load players</div>
                            <div style="color:#666;font-size:.85rem;margin-bottom:16px">${error.message || 'Check your connection and try again'}</div>
                            <button onclick="loadPlayers()" style="padding:11px 28px;background:rgba(255,215,0,.1);border:2px solid rgba(255,215,0,.4);border-radius:10px;color:#FFD700;font-weight:700;cursor:pointer;font-size:.9rem">🔄 Retry</button>
                        </div>`;
                }
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            // Page protection - only teams can access
            if (typeof UI !== 'undefined') {
                UI.initPageProtection(['team']);
            }
            loadTeamInfo();
            loadPlayers();
        });

        // Edit player form - make it global so onclick handler can access it
        window.editPlayer = function(playerId) {
            sessionStorage.setItem('editPlayerId', playerId);
            window.location.href = '/register.html?edit=' + playerId;
        }

        // Medal filter handler
        window.setMedalFilter = function(medalType) {
            currentMedalFilter = medalType;
            updateMedalFilterButtons();
            renderPlayersList();
        }

        // Age category dropdown filter handler
        window.setAgeCategoryFilter = function(category) {
            currentAgeCategoryFilter = category || 'all';
            renderPlayersList();
        }

        // Search handler
        window.searchPlayers = function(query) {
            currentSearchQuery = query || '';
            renderPlayersList();
        }

        // Delete player - make it global so onclick handler can access it
        window.deletePlayer = async function(playerId, playerName, playerTeamId) {
            if (typeof PLAYER_MANAGER !== 'undefined') {
                await PLAYER_MANAGER.deletePlayer(playerId, playerName, playerTeamId);
            } else {
                // Wait for PLAYER_MANAGER to load
                let attempts = 0;
                const wait = setInterval(() => {
                    attempts++;
                    if (typeof PLAYER_MANAGER !== 'undefined') {
                        clearInterval(wait);
                        PLAYER_MANAGER.deletePlayer(playerId, playerName, playerTeamId);
                    }
                    if (attempts > 50) clearInterval(wait);
                }, 100);
            }
        }

        // Override native alert/confirm with custom modals
        window.alert = function(message) {
            return MODAL.showAlert(message);
        };

        window.confirm = function(message) {
            return MODAL.showConfirm(message);
        };
    </script>
</body>
</html>
