<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Dashboard - Taekwondo Championship</title>
    <!-- PAGE PROTECTION -->
    <!-- Favicon - Multiple sizes for better visibility -->
    <link rel="icon" type="image/jpeg" href="/assets/images/favicon.jpeg" sizes="any">
    <link rel="apple-touch-icon" href="/assets/images/favicon.jpeg">
    <meta name="theme-color" content="#FFD700">
    <meta name="description"
        content="Team dashboard for the Taekwondo Championship Manager — view your registered players, manage registrations, and track tournament results.">
    <script>
        (function () {
            var role = sessionStorage.getItem('userRole');
            if (role !== 'team') {
                window.location.replace('/index.html');
            }
        })();
    </script>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preload" as="style" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script defer src="/js/modal.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @keyframes tdSpin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes tdPulse {

            0%,
            100% {
                opacity: .5
            }

            50% {
                opacity: .2
            }
        }

        @keyframes tdFadeUp {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes tdUrgentBlink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .55
            }
        }

        /* Skeleton loader */
        .td-skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, .04) 25%, rgba(255, 255, 255, .08) 50%, rgba(255, 255, 255, .04) 75%);
            background-size: 200% 100%;
            animation: tdPulse 1.5s ease-in-out infinite;
            border-radius: 12px;
            min-height: 120px
        }

        .td-loading {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 28px 0;
            color: #555;
            font-size: .95rem
        }

        .td-spinner {
            width: 26px;
            height: 26px;
            border: 3px solid rgba(255, 215, 0, .25);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: tdSpin .8s linear infinite;
            flex-shrink: 0
        }

        /* Summary cards row */
        .td-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px
        }

        .td-stat {
            border-radius: 12px;
            padding: 18px 16px !important;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform .25s, box-shadow .3s
        }

        .td-stat:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, .3)
        }

        .td-stat::before {
            display: none
        }

        /* Card colour variants */
        .td-stat-1 {
            background: linear-gradient(135deg, #1976D2 0%, #0D47A1 100%);
            border: 3px solid rgba(255, 255, 255, .15);
            border-radius: 24px !important;
            box-shadow: 0 12px 28px rgba(25, 118, 210, .35), 0 4px 12px rgba(0, 0, 0, .2), inset 0 1px 0 rgba(255, 255, 255, .2);
            transition: all .4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            padding: 36px 28px !important
        }

        .td-stat-1::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, .2) 0%, transparent 70%);
            transition: all .6s;
            pointer-events: none
        }

        .td-stat-1:hover {
            box-shadow: 0 16px 36px rgba(25, 118, 210, .45), 0 6px 16px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .3);
            transform: translateY(-6px) scale(1.02)
        }

        .td-stat-1:hover::before {
            right: -20%;
            top: -20%
        }

        .td-stat-1 .td-stat-val {
            color: #FFFFFF;
            text-shadow: 0 2px 4px rgba(0, 0, 0, .2);
            font-size: 1.8rem !important
        }

        .td-stat-2 {
            background: linear-gradient(135deg, #7B1FA2 0%, #4A148C 100%);
            border: 3px solid rgba(255, 255, 255, .15);
            border-radius: 24px !important;
            box-shadow: 0 12px 28px rgba(123, 31, 162, .35), 0 4px 12px rgba(0, 0, 0, .2), inset 0 1px 0 rgba(255, 255, 255, .2);
            transition: all .4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            padding: 36px 28px !important
        }

        .td-stat-2::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, .2) 0%, transparent 70%);
            transition: all .6s;
            pointer-events: none
        }

        .td-stat-2:hover {
            box-shadow: 0 16px 36px rgba(123, 31, 162, .45), 0 6px 16px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .3);
            transform: translateY(-6px) scale(1.02)
        }

        .td-stat-2:hover::before {
            right: -20%;
            top: -20%
        }

        .td-stat-2 .td-stat-val {
            color: #FFFFFF;
            text-shadow: 0 2px 4px rgba(0, 0, 0, .2);
            font-size: 1.8rem !important
        }

        .td-stat-3 {
            background: linear-gradient(135deg, #FBC02D 0%, #F57F17 100%);
            border: 3px solid rgba(0, 0, 0, .1);
            border-radius: 24px !important;
            box-shadow: 0 12px 28px rgba(251, 192, 45, .35), 0 4px 12px rgba(0, 0, 0, .2), inset 0 1px 0 rgba(255, 255, 255, .3);
            transition: all .4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            padding: 36px 28px !important
        }

        .td-stat-3::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, .25) 0%, transparent 70%);
            transition: all .6s;
            pointer-events: none
        }

        .td-stat-3:hover {
            box-shadow: 0 16px 36px rgba(251, 192, 45, .45), 0 6px 16px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .4);
            transform: translateY(-6px) scale(1.02)
        }

        .td-stat-3:hover::before {
            right: -20%;
            top: -20%
        }

        .td-stat-3 .td-stat-val {
            color: #121212;
            text-shadow: 0 2px 4px rgba(255, 255, 255, .3);
            font-size: 1.8rem !important;
            font-weight: 900
        }

        .td-stat-4 {
            background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%);
            border: 3px solid rgba(255, 255, 255, .15);
            border-radius: 24px !important;
            box-shadow: 0 12px 28px rgba(211, 47, 47, .35), 0 4px 12px rgba(0, 0, 0, .2), inset 0 1px 0 rgba(255, 255, 255, .2);
            transition: all .4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            padding: 36px 28px !important
        }

        .td-stat-4::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, .2) 0%, transparent 70%);
            transition: all .6s;
            pointer-events: none
        }

        .td-stat-4:hover {
            box-shadow: 0 16px 36px rgba(211, 47, 47, .45), 0 6px 16px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .3);
            transform: translateY(-6px) scale(1.02)
        }

        .td-stat-4:hover::before {
            right: -20%;
            top: -20%
        }

        .td-stat-4 .td-stat-val {
            color: #FFFFFF;
            text-shadow: 0 2px 4px rgba(0, 0, 0, .2);
            font-size: 1.8rem !important
        }

        .td-stat-icon {
            font-size: 2.2rem !important;
            margin-bottom: 12px;
            display: block;
            transition: all .4s ease;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .1))
        }

        .td-stat:hover .td-stat-icon {
            transform: scale(1.15) rotate(5deg)
        }

        .td-stat-val {
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -.8px;
            transition: all .3s ease;
            word-break: break-word;
            overflow-wrap: break-word
        }

        .td-stat-lbl {
            font-size: .75rem !important;
            color: rgba(255, 255, 255, .95);
            text-transform: uppercase;
            letter-spacing: 1.4px;
            margin-top: 8px;
            font-weight: 700;
            transition: all .3s ease
        }

        .td-stat-3 .td-stat-lbl {
            color: rgba(18, 18, 18, 0.85)
        }

        .td-stat {
            border: none !important
        }

        /* Search bar */
        .td-search {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 18px 12px 16px;
            background: rgba(0, 0, 0, .45);
            border: 2px solid rgba(255, 215, 0, .25);
            border-radius: 12px;
            color: #fff;
            font-size: .95rem;
            font-weight: 500;
            transition: border-color .2s, box-shadow .2s;
            outline: none
        }

        .td-search:focus {
            border-color: #FFD700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, .12)
        }

        .td-search::placeholder {
            color: #666
        }

        .td-search-wrap {
            position: relative;
            min-width: 200px
        }

        /* Filters row */
        .td-filters {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 16px 20px;
            background: rgba(0, 229, 255, .03);
            border: 1.5px solid rgba(0, 229, 255, .12);
            border-radius: 14px
        }

        .td-flbl {
            font-size: .78rem;
            color: #00E5FF;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .8px;
            white-space: nowrap
        }

        /* Player grid */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
            margin-top: 20px
        }

        /* Player card */
        .player-card {
            background: linear-gradient(150deg, rgba(14, 18, 42, .98), rgba(22, 32, 62, .96));
            border: 2px solid rgba(255, 215, 0, .2);
            border-radius: 20px;
            padding: 22px;
            text-align: center;
            transition: transform .25s, box-shadow .25s, border-color .3s;
            animation: tdFadeUp .35s ease;
            overflow: hidden;
            position: relative
        }

        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 40px rgba(255, 215, 0, .12);
            border-color: rgba(255, 215, 0, .45)
        }

        .player-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 215, 0, .5);
            margin-bottom: 12px;
            transition: border-color .3s, box-shadow .3s
        }

        .player-card:hover .player-image {
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, .2)
        }

        .player-info {
            text-align: left;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, .1)
        }

        .player-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            font-size: .88rem
        }

        .player-info-label {
            color: #6a7fa8;
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .8px;
            font-weight: 700
        }

        .player-info-value {
            color: #e8ecf2;
            font-weight: 700;
            font-size: .88rem
        }

        /* Coloured value chips */
        .td-val-gender-m {
            background: rgba(66, 165, 245, .12);
            color: #64b5f6;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: .78rem;
            font-weight: 700
        }

        .td-val-gender-f {
            background: rgba(236, 64, 122, .12);
            color: #f48fb1;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: .78rem;
            font-weight: 700
        }

        .td-val-weight {
            color: #ffb74d;
            font-weight: 800
        }

        .td-val-cat {
            background: rgba(186, 104, 200, .12);
            color: #ce93d8;
            padding: 2px 9px;
            border-radius: 8px;
            font-size: .76rem;
            font-weight: 700
        }

        .td-val-paid {
            background: rgba(102, 187, 106, .1);
            color: #81c784;
            padding: 2px 9px;
            border-radius: 8px;
            font-size: .76rem;
            font-weight: 700
        }

        .td-val-unpaid {
            background: rgba(255, 23, 68, .1);
            color: #ef9a9a;
            padding: 2px 9px;
            border-radius: 8px;
            font-size: .76rem;
            font-weight: 700
        }

        .td-val-center {
            color: #80cbc4;
            font-weight: 700
        }

        /* Badges */
        .status-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: .78rem;
            font-weight: 800;
            margin-top: 10px
        }

        .status-pending {
            background: rgba(255, 152, 0, .15);
            color: #FF9800;
            border: 1.5px solid #FF9800
        }

        .status-approved {
            background: rgba(0, 230, 118, .12);
            color: #00E676;
            border: 1.5px solid #00E676
        }

        .card-badge-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px
        }

        .card-badge-row .status-badge {
            margin-top: 0
        }

        .medal-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .2px;
            text-transform: uppercase;
            border: 1.5px solid transparent
        }

        .medal-gold {
            background: linear-gradient(135deg, #FFD700, #FFC107);
            color: #1f1a00;
            border-color: #B8860B
        }

        .medal-silver {
            background: linear-gradient(135deg, #E5E7EB, #C0C4CC);
            color: #1f2937;
            border-color: #9CA3AF
        }

        .medal-bronze {
            background: linear-gradient(135deg, #CD7F32, #A0522D);
            color: #fff6ee;
            border-color: #7A3E14
        }

        /* Split medal display — shown only when a player has BOTH an Official
           and an Expo medal, so each is clearly attributed to its own bracket. */
        .medal-split {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px
        }

        .medal-split-row {
            display: flex;
            align-items: center;
            gap: 6px
        }

        .medal-split-label {
            font-size: .72rem;
            font-weight: 700;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: .3px
        }

        .medal-split-none {
            font-size: .78rem;
            font-weight: 700;
            color: #666;
            font-style: italic
        }

        /* Competition category badge — which event(s) a player is entered in */
        .comp-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .2px;
            border: 1.5px solid transparent
        }

        .comp-official {
            background: rgba(0, 229, 255, .12);
            color: #00E5FF;
            border-color: #00E5FF
        }

        .comp-expo {
            background: rgba(255, 215, 0, .12);
            color: #FFD700;
            border-color: #FFD700
        }

        .comp-both {
            background: linear-gradient(135deg, rgba(0,229,255,.18), rgba(255,215,0,.18));
            color: #E0E0E0;
            border-color: #B388FF
        }

        /* Poomsae section — shown on a player card only when the player has
           at least one Poomsae category selected; absent otherwise. */
        .poomsae-card-section {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 215, 0, .2);
            text-align: left
        }

        .poomsae-card-title {
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .8px;
            text-transform: uppercase;
            color: #FFD700;
            margin-bottom: 4px
        }

        .poomsae-card-group {
            display: flex;
            align-items: baseline;
            gap: 6px;
            flex-wrap: wrap;
            margin: 3px 0
        }

        .poomsae-card-group-label {
            font-size: .7rem;
            font-weight: 700;
            color: #6a7fa8;
            text-transform: uppercase;
            letter-spacing: .3px
        }

        .poomsae-card-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 0;
            padding: 0;
            list-style: none
        }

        .poomsae-card-list li {
            background: rgba(255, 215, 0, .1);
            color: #ffe082;
            padding: 2px 9px;
            border-radius: 8px;
            font-size: .74rem;
            font-weight: 700
        }

        /* Filter buttons */
        .medal-filter-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px
        }

        .medal-filter-label {
            color: var(--text-gray);
            font-size: .95rem;
            font-weight: 700
        }

        .medal-filter-btn {
            border: 2px solid rgba(255, 215, 0, .3);
            background: rgba(0, 0, 0, .3);
            color: #aaa;
            border-radius: 999px;
            padding: 7px 14px;
            font-size: .85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s
        }

        .medal-filter-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(255, 215, 0, .6);
            color: #fff
        }

        .medal-filter-btn.active {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            border-color: #FFD700
        }

        .category-filter-select {
            border: 2px solid rgba(255, 215, 0, .3);
            background: rgba(0, 0, 0, .4);
            color: #fff;
            border-radius: 10px;
            padding: 7px 12px;
            font-size: .88rem;
            font-weight: 700;
            min-width: 160px;
            outline: none;
            transition: border-color .2s
        }

        .category-filter-select:focus {
            box-shadow: 0 0 0 2px rgba(0, 229, 255, .25);
            border-color: #00E5FF
        }

        .category-filter-select option {
            background: #0a0e2a;
            color: #fff
        }

        /* Action buttons on card */
        .td-card-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px
        }

        .td-btn-edit {
            flex: 1;
            padding: 10px;
            background: rgba(0, 229, 255, .08);
            border: 2px solid #00E5FF;
            border-radius: 10px;
            color: #00E5FF;
            font-weight: 800;
            font-size: .85rem;
            cursor: pointer;
            transition: all .2s
        }

        .td-btn-edit:hover {
            background: rgba(0, 229, 255, .18);
            transform: translateY(-1px)
        }

        .td-btn-del {
            padding: 10px 14px;
            background: rgba(255, 23, 68, .08);
            border: 2px solid rgba(255, 23, 68, .3);
            border-radius: 10px;
            color: #ff6b6b;
            font-weight: 700;
            font-size: .85rem;
            cursor: pointer;
            transition: all .2s
        }

        .td-btn-del:hover {
            border-color: #FF1744;
            color: #FF1744;
            background: rgba(255, 23, 68, .15)
        }

        /* Empty state */
        .td-empty {
            text-align: center;
            padding: 60px 20px;
            border: 2px dashed rgba(255, 255, 255, .07);
            border-radius: 18px
        }

        .td-empty-icon {
            font-size: 3.5rem;
            margin-bottom: 14px
        }

        .td-empty-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #666;
            margin-bottom: 6px
        }

        .td-empty-sub {
            font-size: .88rem;
            color: #444
        }

        /* Registration status banner */
        .td-reg-banner {
            padding: 18px 24px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2)
        }

        .td-reg-open {
            background: #388E3C;
            border: none;
            color: #FFFFFF
        }

        .td-reg-closed {
            background: #D32F2F;
            border: none;
            color: #FFFFFF
        }

        /* Player count pill */
        .td-count-pill {
            background: rgba(255, 215, 0, .1);
            border: 1.5px solid rgba(255, 215, 0, .3);
            color: #FFD700;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: .82rem;
            font-weight: 800;
            white-space: nowrap
        }

        /* Championship Ticker */
        .championship-ticker {
            background: linear-gradient(135deg, rgba(26, 26, 46, .95), rgba(22, 33, 62, .95));
            border-bottom: 2px solid rgba(255, 215, 0, .5);
            padding: 16px 0;
            overflow: hidden;
            width: 100%;
            margin-bottom: 24px;
        }

        .ticker-content {
            display: inline-block;
            white-space: nowrap;
            animation: tickerScroll 40s linear infinite;
            padding-left: 100%;
            font-size: 1.1rem;
            font-weight: 700;
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, .4);
            letter-spacing: 2px;
        }

        .championship-ticker:hover .ticker-content {
            animation-play-state: paused;
        }

        @keyframes tickerScroll {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-100%);
            }
        }

    <script type="module">
        let teamPlayers = [];
        let currentMedalFilter = 'all';
        let currentMatchTypeFilter = null; // 'Official' | 'Expo' — which bracket's medal to filter by
        let currentAgeCategoryFilter = 'all';
        let currentTeamName = '';
        let _playersUnsubscribers = [];

        const MEDAL_PRIORITY = {
            '1st Bronze': 1,
            '2nd Bronze': 1,
            Bronze: 1,
            Silver: 2,
            Gold: 3
        };

        function toOrderedArray(value) {
            if (!value) return [];
            if (Array.isArray(value)) return value;
            return Object.keys(value)
                .sort((a, b) => Number(a) - Number(b))
                .map(key => value[key]);
        }

        function setBestMedal(map, playerId, medalType) {
            if (!playerId || !medalType || !MEDAL_PRIORITY[medalType]) return;
            const current = map[playerId];
            if (!current || MEDAL_PRIORITY[medalType] > MEDAL_PRIORITY[current.type]) {
                map[playerId] = { type: medalType };
            }
        }

        function buildMedalMapFromBrackets(bracketsData) {
            const medalMap = {};
            if (!bracketsData || typeof bracketsData !== 'object') {
                return medalMap;
            }

            Object.values(bracketsData).forEach(bracket => {
                if (!bracket) return;

                const rounds = toOrderedArray(bracket.rounds || []).map(round => toOrderedArray(round));
                // Detect single-player walkover: rounds may be [], or [[]] (one round with zero matches)
                const hasActualMatches = rounds.some(r => r.length > 0);

                if (!hasActualMatches) {
                    // Single-player walkover: no matches, winner is the bye player
                    const byePlayers = bracket.byePlayers || {};
                    const byePlayer = byePlayers['0'];
                    if (byePlayer && byePlayer.id) {
                        setBestMedal(medalMap, byePlayer.id, 'Gold');
                    }
                    return;
                }

                // Final round: champion + runner-up
                const finalRound = rounds[rounds.length - 1] || [];
                const finalMatch = finalRound[0];
                if (finalMatch && finalMatch.status === 'completed' && finalMatch.winner) {
                    const p1 = finalMatch.player1 || null;
                    const p2 = finalMatch.player2 || null;
                    const championId = finalMatch.winner;
                    const runnerUpId = p1 && p1.id === championId ? (p2 && p2.id) : (p1 && p1.id);

                    setBestMedal(medalMap, championId, 'Gold');
                    setBestMedal(medalMap, runnerUpId, 'Silver');
                }

                // Semi-final losers: bronze
                if (rounds.length >= 2) {
                    const semiFinalRound = rounds[rounds.length - 2] || [];
                    semiFinalRound.forEach((match, index) => {
                        if (!match || match.status !== 'completed' || !match.eliminated) return;
                        setBestMedal(medalMap, match.eliminated, index === 0 ? '1st Bronze' : '2nd Bronze');
                    });
                }
            });

            return medalMap;
        }

        // Expo medals — separate isolated tree (expoBrackets/), flat match list
        // (no rounds, no bronze). Kept in its own map, never merged with Official
        // medals, so a player's Official and Expo results stay independently
        // trackable (see loadPlayers()'s officialMedalType/expoMedalType split).
        function buildMedalMapFromExpoBrackets(expoBracketsData) {
            const medalMap = {};
            if (!expoBracketsData || typeof expoBracketsData !== 'object') {
                return medalMap;
            }

            Object.values(expoBracketsData).forEach(bracket => {
                if (!bracket) return;
                (bracket.matches || []).forEach(match => {
                    if (!match || match.status !== 'completed' || !match.winner) return;
                    const winnerId = match.winner;
                    const loserId = match.player1?.id === winnerId ? match.player2?.id : match.player1?.id;
                    setBestMedal(medalMap, winnerId, 'Gold');
                    if (loserId) setBestMedal(medalMap, loserId, 'Silver');
                });
                (bracket.byes || []).forEach(p => {
                    if (p && p.id) setBestMedal(medalMap, p.id, 'Gold');
                });
            });

            return medalMap;
        }

        function getSingleMedalBadge(medalType) {
            if (!medalType) return '';

            if (medalType === 'Gold') {
                return '<span class="medal-badge medal-gold">🥇 Gold</span>';
            }
            if (medalType === 'Silver') {
                return '<span class="medal-badge medal-silver">🥈 Silver</span>';
            }
            if (medalType === 'Bronze' || medalType === '1st Bronze' || medalType === '2nd Bronze') {
                return `<span class="medal-badge medal-bronze">🥉 ${medalType}</span>`;
            }

            return '';
        }

        // Official and Expo medals are tracked independently. A player registered
        // for BOTH categories always shows each bracket on its own labeled line —
        // even if they've only won a medal in one of the two so far — so a lone
        // Silver badge is never ambiguous about which bracket it came from.
        // Players registered for only one category keep the original plain badge.
        function getMedalBadgeHtml(officialMedalType, expoMedalType, competitionCategory) {
            if (competitionCategory === 'Official & Expo') {
                const officialHtml = officialMedalType
                    ? getSingleMedalBadge(officialMedalType)
                    : '<span class="medal-split-none">No Medal</span>';
                const expoHtml = expoMedalType
                    ? getSingleMedalBadge(expoMedalType)
                    : '<span class="medal-split-none">No Medal</span>';
                return `
                    <div class="medal-split">
                        <div class="medal-split-row"><span class="medal-split-label">Official:</span>${officialHtml}</div>
                        <div class="medal-split-row"><span class="medal-split-label">Expo:</span>${expoHtml}</div>
                    </div>
                `;
            }
            if (officialMedalType) return getSingleMedalBadge(officialMedalType);
            if (expoMedalType) return getSingleMedalBadge(expoMedalType);
            return '';
        }

        // Which event(s) a player is entered in — players registered before this
        // field existed have no competitionCategory, defaulting to Official
        // (the only option that existed before Expo was added).
        function getCompetitionBadgeHtml(competitionCategory) {
            const category = competitionCategory || 'Official';
            if (category === 'Expo') {
                return '<span class="comp-badge comp-expo">Expo</span>';
            }
            if (category === 'Official & Expo') {
                return '<span class="comp-badge comp-both">Official &amp; Expo</span>';
            }
            return '<span class="comp-badge comp-official">Official</span>';
        }

        // Poomsae section shown on a player card — only when the player has
        // at least one Poomsae category selected (backward compatible: older
        // players have no `poomsaeCategories` field and simply show nothing).
        function getPoomsaeSectionHtml(poomsaeCategories) {
            if (!Array.isArray(poomsaeCategories) || poomsaeCategories.length === 0) return '';

            const official = [];
            const expo = [];
            poomsaeCategories.forEach(cat => {
                if (typeof cat !== 'string') return;
                if (cat.startsWith('Official ')) official.push(cat.slice('Official '.length));
                else if (cat.startsWith('Expo ')) expo.push(cat.slice('Expo '.length));
            });

            if (official.length === 0 && expo.length === 0) return '';

            let html = '<div class="poomsae-card-section"><div class="poomsae-card-title">Poomsae</div>';
            if (official.length) {
                html += `<div class="poomsae-card-group"><span class="poomsae-card-group-label">Official</span><ul class="poomsae-card-list">${official.map(d => `<li>${d}</li>`).join('')}</ul></div>`;
            }
            if (expo.length) {
                html += `<div class="poomsae-card-group"><span class="poomsae-card-group-label">Expo</span><ul class="poomsae-card-list">${expo.map(d => `<li>${d}</li>`).join('')}</ul></div>`;
            }
            html += '</div>';
            return html;
        }

        function updateMedalFilterButtons() {
            document.querySelectorAll('[data-medal-filter]').forEach(btn => {
                const isActive = btn.getAttribute('data-medal-filter') === currentMedalFilter;
                btn.classList.toggle('active', isActive);
            });

            const mainBronze = document.getElementById('bronzeFilterBtn');
            if (mainBronze) {
                if (currentMedalFilter === '1st Bronze' || currentMedalFilter === '2nd Bronze') {
                    mainBronze.classList.add('active');
                    mainBronze.innerHTML = currentMedalFilter === '1st Bronze' ? '🥉 1st Bronze' : '🥉 2nd Bronze';
                } else {
                    mainBronze.innerHTML = '🥉 Bronze';
                }
            }

            const goldBtn = document.getElementById('goldFilterBtn');
            if (goldBtn) {
                if (currentMedalFilter === 'Gold' && currentMatchTypeFilter) {
                    goldBtn.classList.add('active');
                    goldBtn.innerHTML = `🥇 Gold (${currentMatchTypeFilter})`;
                } else {
                    goldBtn.innerHTML = '🥇 Gold';
                }
            }

            const silverBtn = document.getElementById('silverFilterBtn');
            if (silverBtn) {
                if (currentMedalFilter === 'Silver' && currentMatchTypeFilter) {
                    silverBtn.classList.add('active');
                    silverBtn.innerHTML = `🥈 Silver (${currentMatchTypeFilter})`;
                } else {
                    silverBtn.innerHTML = '🥈 Silver';
                }
            }
        }

        function getPlayerAgeCategory(player) {
            return String(player?.ageCategory || '').trim() || 'Unknown';
        }

        function getAgeCategorySortRank(category) {
            const sortOrder = {
                Mini: 1,
                'Sub-Junior': 2,
                Cadet: 3,
                Junior: 4,
                Senior: 5,
                Unknown: 99
            };
            return sortOrder[category] || 50;
        }

        function populateAgeCategoryFilterOptions() {
            const filterSelect = document.getElementById('ageCategoryFilter');
            if (!filterSelect) return;

            const uniqueCategories = [...new Set(teamPlayers.map(getPlayerAgeCategory))]
                .sort((a, b) => {
                    const rankA = getAgeCategorySortRank(a);
                    const rankB = getAgeCategorySortRank(b);
                    if (rankA !== rankB) return rankA - rankB;
                    return a.localeCompare(b);
                });

            filterSelect.innerHTML = '<option value="all">All Categories</option>';
            uniqueCategories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                filterSelect.appendChild(option);
            });

            const hasSelectedCategory = uniqueCategories.includes(currentAgeCategoryFilter);
            if (!hasSelectedCategory) {
                currentAgeCategoryFilter = 'all';
            }
            filterSelect.value = currentAgeCategoryFilter;
            filterSelect.disabled = teamPlayers.length === 0;
        }

        let currentSearchQuery = '';

        function renderPlayersList() {
            const playersList = document.getElementById('playersList');
            if (!playersList) return;

            const filteredPlayers = teamPlayers.filter(player => {
                const medalMatch = currentMedalFilter === 'all' || (
                    currentMatchTypeFilter === 'Expo'
                        ? player.expoMedalType === currentMedalFilter
                        : player.officialMedalType === currentMedalFilter
                );
                const categoryMatch = currentAgeCategoryFilter === 'all' || getPlayerAgeCategory(player) === currentAgeCategoryFilter;
                const searchMatch = !currentSearchQuery || player.playerName.toLowerCase().includes(currentSearchQuery.toLowerCase());
                return medalMatch && categoryMatch && searchMatch;
            });

            // Update count pill
            const pill = document.getElementById('playerCountPill');
            if (pill) pill.textContent = `${filteredPlayers.length} player${filteredPlayers.length !== 1 ? 's' : ''}`;

            if (filteredPlayers.length === 0) {
                if (teamPlayers.length === 0) {
                    playersList.innerHTML = `<div class="td-empty" style="grid-column:1/-1"><div class="td-empty-icon">🥋</div><div class="td-empty-title">No players registered yet</div><div class="td-empty-sub">Click "Register Player" to add your first athlete</div></div>`;
                } else {
                    playersList.innerHTML = `<div class="td-empty" style="grid-column:1/-1"><div class="td-empty-icon">🔍</div><div class="td-empty-title">No matches found</div><div class="td-empty-sub">Try adjusting your filters or search</div></div>`;
                }
                return;
            }

            let html = '';
            filteredPlayers.forEach(player => {
                const medalBadgeHtml = getMedalBadgeHtml(player.officialMedalType, player.expoMedalType, player.competitionCategory);
                const approvedBadgeHtml = player.status === 'approved'
                    ? '<span class="status-badge status-approved">✅ Approved</span>'
                    : '';
                const compBadgeHtml = getCompetitionBadgeHtml(player.competitionCategory);
                const badgeRowHtml = `<div class="card-badge-row">${compBadgeHtml}${approvedBadgeHtml}${medalBadgeHtml}</div>`;
                const poomsaeSectionHtml = getPoomsaeSectionHtml(player.poomsaeCategories);
                const tn = (player.playerName || '').replace(/'/g, "\\'");

                html += `
                    <div class="player-card">
                        <img src="${player.playerImage}" alt="${player.playerName}" class="player-image">
                        <h3 style="color:#FFD700;margin:6px 0 2px;font-size:1.05rem;font-weight:900">${player.playerName}</h3>
                        <div style="font-size:.76rem;font-weight:700;letter-spacing:.5px">
                            <span class="td-val-cat">${player.ageCategory || 'N/A'}</span>
                            <span style="color:#555;margin:0 4px">·</span>
                            <span class="td-val-weight">${player.weightCategory || 'N/A'}</span>
                        </div>

                        <div class="player-info">
                            <div class="player-info-row"><span class="player-info-label">Gender</span><span class="${player.gender === 'Male' ? 'td-val-gender-m' : 'td-val-gender-f'}">${player.gender}</span></div>
                            <div class="player-info-row"><span class="player-info-label">Age</span><span class="player-info-value">${player.age} yrs</span></div>
                            <div class="player-info-row"><span class="player-info-label">Weight</span><span class="td-val-weight">${player.weight != null && player.weight !== '' ? `${player.weight} kg` : 'N/A'}</span></div>
                            <div class="player-info-row"><span class="player-info-label">Center</span><span class="td-val-center">${player.centerName}</span></div>
                            <div class="player-info-row"><span class="player-info-label">Phone</span><span class="player-info-value">${player.phoneNumber || 'N/A'}</span></div>
                        </div>

                        ${badgeRowHtml}
                        ${poomsaeSectionHtml}

                        <div class="td-card-actions">
                            <button class="td-btn-edit" onclick="editPlayer('${player.id}')">✏️ Edit</button>
                            <button class="td-btn-del" onclick="deletePlayer('${player.id}', '${tn}', '${player.teamId}')">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            });

            playersList.innerHTML = html;
        }

        async function loadTeamInfo() {
            const user = AUTH_MANAGER.getCurrentUser();
            const teamId = user.teamId;

            if (!teamId) {
                document.getElementById('teamInfo').innerHTML = '<p>Team information not found.</p>';
                return;
            }

            try {
                const teamRef = dbRef(database, `teams/${teamId}`);
                const snapshot = await dbGet(teamRef);

                if (snapshot.exists()) {
                    const team = snapshot.val();
                    currentTeamName = team.teamName || '';

                    // Update header with team name
                    const titleEl = document.getElementById('teamTitle');
                    if (titleEl) titleEl.textContent = `🥋 ${team.teamName}`;

                    // ── CHECK PER-TEAM DEADLINE / CLOSED STATUS ──────────────
                    const registerBtn = document.getElementById('registerBtn');
                    const now = new Date();
                    let registrationBlocked = false;
                    let blockedReason = '';

                    if (team.registrationClosed === true) {
                        registrationBlocked = true;
                        blockedReason = 'Registration closed by admin';
                    } else if (team.registrationDeadline) {
                        const dl = new Date(team.registrationDeadline);
                        if (!team.registrationDeadline.includes('T')) {
                            dl.setHours(23, 59, 59, 999);
                        }
                        if (now > dl) {
                            registrationBlocked = true;
                            const fmt = new Date(team.registrationDeadline).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
                            blockedReason = `Deadline passed (${fmt})`;
                        }
                    }



                    if (registrationBlocked && registerBtn) {
                        registerBtn.disabled = true;
                        registerBtn.textContent = '🔒 Registration Closed';
                        registerBtn.title = blockedReason;

        function updatePlayerCount() {
            const countEl = document.getElementById('playerCount');
            if (countEl) countEl.textContent = teamPlayers.length;
        }

        // ── sessionStorage helpers ────────────────────────────────────────────
        // Player TEXT data is cached under 'tdp_{teamId}' (images excluded — stored separately).
        // Images are cached under 'img_{playerId}' to avoid re-downloading on every refresh.
        // Both caches survive page refreshes within the same browser tab session.

        function savePlayersCache(teamId, players) {
            try {
                const slim = players.map(({ playerImage, ...rest }) => rest); // no image blobs in text cache
                sessionStorage.setItem('tdp_' + teamId, JSON.stringify(slim));
                sessionStorage.setItem('tdp_ts_' + teamId, Date.now().toString());
            } catch (_) { } // quota exceeded — skip silently
        }

        function loadPlayersCache(teamId) {
            try {
                const raw = sessionStorage.getItem('tdp_' + teamId);
                const ts = parseInt(sessionStorage.getItem('tdp_ts_' + teamId) || '0');
                if (!raw || Date.now() - ts > 5 * 60 * 1000) return []; // 5 min TTL
                return JSON.parse(raw);
            } catch (_) { return []; }
        }

        async function fetchPlayerImage(player, playerId) {
            // If image is already embedded in the record, cache it and return
            if (player.playerImage) {
                try { sessionStorage.setItem('img_' + playerId, player.playerImage); } catch (_) { }
                return;
            }
            // Check sessionStorage — avoids re-downloading on every page refresh
            const cached = sessionStorage.getItem('img_' + playerId);
            if (cached) {
                player.playerImage = cached;
                return;
            }
            // Not cached — fetch from Firebase once and cache it
            try {
                const imgSnap = await dbGet(dbRef(database, `playerImages/${playerId}`));
                if (imgSnap.exists()) {
                    player.playerImage = imgSnap.val();
                    try { sessionStorage.setItem('img_' + playerId, imgSnap.val()); } catch (_) { }
                }
            } catch (_) { }
        }

        async function loadPlayers() {
            const user = AUTH_MANAGER.getCurrentUser();
            const teamId = user.teamId;

            // Tear down any previous listeners before re-subscribing
            _playersUnsubscribers.forEach(unsub => unsub());
            _playersUnsubscribers = [];

            try {
                const playersRef = dbRef(database, 'players');
                const bracketsRef = dbRef(database, 'brackets');

                // ── Step 1: Render from sessionStorage cache immediately ───────
                // Images are also in sessionStorage per-player, so fetchPlayerImage
                // reads them from there — zero Firebase downloads on this render pass.
                const cachedPlayers = loadPlayersCache(teamId);
                if (cachedPlayers.length > 0) {
                    teamPlayers = cachedPlayers;
                    await Promise.all(teamPlayers.map(p => fetchPlayerImage(p, p.id)));
                    updatePlayerCount();
                    populateAgeCategoryFilterOptions();
                    renderPlayersList();
                }

                // ── Step 2: Fetch fresh text data from Firebase ───────────────
                // Text data is small (a few KB total). Images are NOT downloaded
                // here because fetchPlayerImage will serve them from sessionStorage.
                const [playersSnapshot, bracketsSnapshot] = await Promise.all([
                    dbGet(playersRef),
                    dbGet(bracketsRef)
                ]);

                const officialMedalMap = bracketsSnapshot.exists()
                    ? buildMedalMapFromBrackets(bracketsSnapshot.val())
                    : {};

                // Expo medals are kept in their OWN map — never merged with Official —
                // so a player entered in both brackets keeps two independent results
                // instead of one overwriting the other. Fetched separately and
                // non-fatally — a permission/rules issue on the isolated expoBrackets/
                // tree must never break loading the main roster.
                let expoMedalMap = {};
                try {
                    const expoBracketsSnapshot = await dbGet(dbRef(database, 'expoBrackets'));
                    if (expoBracketsSnapshot.exists()) {
                        expoMedalMap = buildMedalMapFromExpoBrackets(expoBracketsSnapshot.val());
                    }
                } catch (expoErr) {
                    console.warn('⚠️ Could not load Expo medals (non-fatal):', expoErr.message);
                }

                const players = [];
                const seenIds = new Set();
                if (playersSnapshot.exists()) {
                    playersSnapshot.forEach(child => {
                        const player = child.val();
                        if (player.teamId === teamId) {
                            players.push({
                                id: child.key, ...player,
                                officialMedalType: officialMedalMap[child.key]?.type || null,
                                expoMedalType: expoMedalMap[child.key]?.type || null
                            });
                            seenIds.add(child.key);
                        }
                    });
                }

                // Merge in Expo-only players (Competition Category "Expo") — they live
                // only in expoPlayers/, not players/, so they'd otherwise never show up
                // here. "Official & Expo" players are skipped (seenIds) since they're
                // already included above from players/.
                try {
                    const expoPlayersSnapshot = await dbGet(dbRef(database, 'expoPlayers'));
                    if (expoPlayersSnapshot.exists()) {
                        expoPlayersSnapshot.forEach(child => {
                            const player = child.val();
                            if (player.teamId === teamId && !seenIds.has(child.key)) {
                                players.push({
                                    id: child.key, ...player,
                                    officialMedalType: officialMedalMap[child.key]?.type || null,
                                    expoMedalType: expoMedalMap[child.key]?.type || null
                                });
                                seenIds.add(child.key);
                            }
                        });
                    }
                } catch (expoErr) {
                    console.warn('⚠️ Could not load Expo-only players (non-fatal):', expoErr.message);
                }

                players.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

                // Fetch images — hits sessionStorage cache for existing players,
                // only downloads from Firebase for genuinely new players.
                await Promise.all(players.map(p => fetchPlayerImage(p, p.id)));

                teamPlayers = players;
                savePlayersCache(teamId, players); // update text cache for next page load
                updatePlayerCount();
                populateAgeCategoryFilterOptions();
                renderPlayersList();

                // ── Step 3: Real-time listeners ───────────────────────────────
                // Build a Set of already-loaded IDs so onChildAdded skips existing
                // children (Firebase fires it for every existing child using its
                // local SDK cache — no extra network cost, but we skip them because
                // they're already in teamPlayers).
                const loadedIds = new Set(teamPlayers.map(p => p.id));

                // Real-time: new player added
                const unsubAdded = dbOnChildAdded(playersRef, async (snapshot) => {
                    const playerId = snapshot.key;
                    if (loadedIds.has(playerId)) return; // already loaded, skip
                    const player = snapshot.val();
                    if (player.teamId !== teamId) return;

                    loadedIds.add(playerId);
                    await fetchPlayerImage(player, playerId); // caches image in sessionStorage

                    teamPlayers.push({ id: playerId, ...player, officialMedalType: null, expoMedalType: null });
                    teamPlayers.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));
                    savePlayersCache(teamId, teamPlayers);

                    updatePlayerCount();
                    populateAgeCategoryFilterOptions();
                    renderPlayersList();
                });

                // Real-time: existing player updated (e.g. admin approves, edits details)
                // Firebase only sends the single changed player's data — very cheap.
                const unsubChanged = dbOnChildChanged(playersRef, async (snapshot) => {
                    const playerId = snapshot.key;
                    const player = snapshot.val();
                    const idx = teamPlayers.findIndex(p => p.id === playerId);

                    if (player.teamId !== teamId) {
                        if (idx !== -1) {
                            teamPlayers.splice(idx, 1);
                            loadedIds.delete(playerId);
                            sessionStorage.removeItem('img_' + playerId);
                            savePlayersCache(teamId, teamPlayers);
                            updatePlayerCount();
                            populateAgeCategoryFilterOptions();
                            renderPlayersList();
                        }
                        return;
                    }

                    // Admin may have updated the player's image — invalidate its cache
                    // so fetchPlayerImage re-downloads the latest version.
                    sessionStorage.removeItem('img_' + playerId);

                    await fetchPlayerImage(player, playerId); // re-fetches and re-caches image

                    // Preserve medal types — they come from brackets, not the player record
                    const officialMedalType = idx !== -1 ? teamPlayers[idx].officialMedalType : null;
                    const expoMedalType = idx !== -1 ? teamPlayers[idx].expoMedalType : null;
                    const updated = { id: playerId, ...player, officialMedalType, expoMedalType };

                    if (idx !== -1) {
                        teamPlayers[idx] = updated;
                    } else {
                        loadedIds.add(playerId);
                        teamPlayers.push(updated);
                        teamPlayers.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));
                    }

                    savePlayersCache(teamId, teamPlayers);
                    updatePlayerCount();
                    populateAgeCategoryFilterOptions();
                    renderPlayersList();
                });

                // Real-time: player deleted
                const unsubRemoved = dbOnChildRemoved(playersRef, (snapshot) => {
                    const playerId = snapshot.key;
                    const idx = teamPlayers.findIndex(p => p.id === playerId);
                    if (idx !== -1) {
                        teamPlayers.splice(idx, 1);
                        loadedIds.delete(playerId);
                        sessionStorage.removeItem('img_' + playerId); // free up cache space
                        savePlayersCache(teamId, teamPlayers);
                        updatePlayerCount();
                        populateAgeCategoryFilterOptions();
                        renderPlayersList();
                    }
                });

                _playersUnsubscribers = [unsubAdded, unsubChanged, unsubRemoved];

            } catch (error) {
                console.error('Error loading players:', error);
                const playersList = document.getElementById('playersList');
                if (playersList) {
                    playersList.innerHTML = `
                        <div style="grid-column:1/-1;padding:40px 20px;background:rgba(255,23,68,.08);border:2px solid rgba(255,23,68,.3);border-radius:14px;text-align:center">
                            <div style="font-size:2.5rem;margin-bottom:10px">⚠️</div>
                            <div style="color:#ef9a9a;font-weight:700;font-size:1.05rem;margin-bottom:6px">Failed to load players</div>
                            <div style="color:#666;font-size:.85rem;margin-bottom:16px">${error.message || 'Check your connection and try again'}</div>
                            <button onclick="loadPlayers()" style="padding:11px 28px;background:rgba(255,215,0,.1);border:2px solid rgba(255,215,0,.4);border-radius:10px;color:#FFD700;font-weight:700;cursor:pointer;font-size:.9rem">Retry</button>
                        </div>`;
                }
            }
        }


        async function loadChampionshipTicker() {
            try {
                const formConfigRef = dbRef(database, 'formConfig');
                const snapshot = await dbGet(formConfigRef);

                if (snapshot.exists() && snapshot.val().championship) {
                    const champ = snapshot.val().championship;

                    const address = champ.address || '';

                    const tickerContent = `🏆 ${title}  •  📍 Venue: ${venue}  •  📍 Location: ${address}  •  📅 Date: ${date}  •  👤 Organizer: ${organizer}  •  🏆 ${title}  •  📍 Venue: ${venue}  •  📍 Location: ${address}  •  📅 Date: ${date}  •  👤 Organizer: ${organizer}  •  `;

        // ── Excel exports (read-only — no data is written) ────────────────────
        // Reuses teamPlayers (already loaded for the dashboard view) and the
        // same age-category ranking used by the on-page filter, so the export
        // always mirrors what loadPlayers() populated — no separate data path.

        function sortPlayersByAgeCategory(players) {
            return players
                .map((player, index) => ({ player, index }))
                .sort((a, b) => {
                    const rankA = getAgeCategorySortRank(getPlayerAgeCategory(a.player));
                    const rankB = getAgeCategorySortRank(getPlayerAgeCategory(b.player));
                    if (rankA !== rankB) return rankA - rankB;
                    return a.index - b.index; // preserve existing relative order
                })
                .map(entry => entry.player);
        }

        function getDivisionLabel(competitionCategory) {
            const category = competitionCategory || 'Official';
            if (category === 'Expo') return 'Expo';
            if (category === 'Official & Expo') return 'Both';
            return 'Official';
        }

        function getResultLabel(medalType) {
            if (!medalType) return 'No Medal';
            if (medalType === '1st Bronze' || medalType === '2nd Bronze') return 'Bronze';
            return medalType; // Gold | Silver | Bronze
        }

        // 'N/A' when the player isn't entered in that division at all,
        // otherwise the medal (or 'No Medal' if not won one).
        function getDivisionResult(player, division) {
            const category = player.competitionCategory || 'Official';
            const inOfficial = category === 'Official' || category === 'Official & Expo';
            const inExpo = category === 'Expo' || category === 'Official & Expo';
            if (division === 'Official') {
                return inOfficial ? getResultLabel(player.officialMedalType) : 'N/A';
            }
            return inExpo ? getResultLabel(player.expoMedalType) : 'N/A';
        }

        function autoSizeColumns(worksheet, rows) {
            const headerRow = rows[0] || [];
            worksheet['!cols'] = headerRow.map((_, colIndex) => {
                let maxLen = 10;
                rows.forEach(row => {
                    const cellVal = row[colIndex] != null ? String(row[colIndex]) : '';
                    if (cellVal.length > maxLen) maxLen = cellVal.length;
                });
                return { wch: maxLen + 2 };
            });
        }

        function downloadWorkbook(rows, sheetName, fileSuffix) {
            const ws = XLSX.utils.aoa_to_sheet(rows);
            autoSizeColumns(ws, rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
            const teamNameSafe = (currentTeamName || 'Team').replace(/[^a-z0-9]+/gi, '_');
            XLSX.writeFile(wb, `${teamNameSafe}_${fileSuffix}.xlsx`);
        }

        window.downloadPlayerInformation = function () {
            if (!teamPlayers.length) {
                MODAL.showAlert('No players to export yet.');
                return;
            }
            const sorted = sortPlayersByAgeCategory(teamPlayers);
            const headers = ['#', 'Player Name', 'Gender', 'Age', 'Age Category', 'Weight', 'Weight Category',
                'Center Name', 'Phone Number', 'Division', 'Status', 'Official Medal', 'Expo Medal'];
            const rows = sorted.map((player, index) => [
                index + 1,
                player.playerName || 'N/A',
                player.gender || 'N/A',
                player.age != null && player.age !== '' ? `${player.age} yrs` : 'N/A',
                player.ageCategory || 'N/A',
                player.weight != null && player.weight !== '' ? `${player.weight} kg` : 'N/A',
                player.weightCategory || 'N/A',
                player.centerName || 'N/A',
                player.phoneNumber || 'N/A',
                getDivisionLabel(player.competitionCategory),
                player.status === 'approved' ? 'Approved' : 'Pending',
                getDivisionResult(player, 'Official'),
                getDivisionResult(player, 'Expo')
            ]);
            downloadWorkbook([headers, ...rows], 'Players', 'Player_Information');
        };

        window.downloadResults = function () {
            if (!teamPlayers.length) {
                MODAL.showAlert('No players to export yet.');
                return;
            }
            const sorted = sortPlayersByAgeCategory(teamPlayers);
            const headers = ['#', 'Player Name', 'Team Name', 'Gender', 'Weight Category', 'Age Category',
                'Division', 'Official Result', 'Expo Result'];
            const rows = sorted.map((player, index) => [
                index + 1,
                player.playerName || 'N/A',
                currentTeamName || 'N/A',
                player.gender || 'N/A',
                player.weightCategory || 'N/A',
                player.ageCategory || 'N/A',
                getDivisionLabel(player.competitionCategory),
                getDivisionResult(player, 'Official'),
                getDivisionResult(player, 'Expo')
            ]);
            downloadWorkbook([headers, ...rows], 'Results', 'Results');
        };

        // Poomsae export — only this team's players who selected at least one
        // Poomsae division; one row per selected division (never combined into
        // one cell), matching the admin-side Poomsae export format.
        function splitPoomsaeCategory(category) {
            if (typeof category !== 'string') return null;
            if (category.startsWith('Official ')) return { competitionType: 'Official', division: category.slice('Official '.length) };
            if (category.startsWith('Expo ')) return { competitionType: 'Expo', division: category.slice('Expo '.length) };
            return null;
        }

        window.downloadPoomsaeExcel = function () {
            const poomsaePlayers = teamPlayers.filter(p => Array.isArray(p.poomsaeCategories) && p.poomsaeCategories.length > 0);
            if (!poomsaePlayers.length) {
                MODAL.showAlert('No players registered for Poomsae yet.');
                return;
            }
            const sorted = sortPlayersByAgeCategory(poomsaePlayers);
            const headers = ['#', 'Player Name', 'Gender', 'Age Category', 'Weight', 'Poomsae Division', 'Competition Type'];
            const rows = [];
            let rowNum = 0;
            sorted.forEach(player => {
                player.poomsaeCategories.forEach(category => {
                    const parsed = splitPoomsaeCategory(category);
                    if (!parsed) return;
                    rowNum++;
                    rows.push([
                        rowNum,
                        player.playerName || 'N/A',
                        player.gender || 'N/A',
                        player.ageCategory || 'N/A',
                        player.weight != null && player.weight !== '' ? `${player.weight} kg` : 'N/A',
                        parsed.division,
                        parsed.competitionType
                    ]);
                });
            });
            downloadWorkbook([headers, ...rows], 'Poomsae', 'Poomsae_Registrations');
        };

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            // Page protection - only teams can access
            if (typeof UI !== 'undefined') {
                UI.initPageProtection(['team']);
            }
            loadChampionshipTicker();
            loadTeamInfo();
            loadPlayers();
        });

        // Retry button in the "Failed to load players" error state calls this
        // via inline onclick, which runs outside this module's scope — expose it.
        window.loadPlayers = loadPlayers;

        // Edit player form - make it global so onclick handler can access it
        window.editPlayer = function (playerId) {
            sessionStorage.setItem('editPlayerId', playerId);
            window.location.href = '/register.html?edit=' + playerId;
        }

        // Medal filter handler
        window.setMedalFilter = function (medalType, matchType) {
            currentMedalFilter = medalType;
            currentMatchTypeFilter = medalType === 'all' ? null : (matchType || 'Official');
            updateMedalFilterButtons();
            renderPlayersList();
        }

        window.toggleBronzeDropdown = function (e) {
            if (e) e.stopPropagation();
            const dropdown = document.getElementById('bronzeDropdown');
            if (dropdown) {
                dropdown.style.display = dropdown.style.display === 'none' ? 'flex' : 'none';
            }
        };

        // Gold/Silver need a second choice (Official vs Expo) before filtering,
        // since a player can hold different medals in each bracket.
        window.toggleMatchTypeDropdown = function (e, medal) {
            if (e) e.stopPropagation();
            const dropdown = document.getElementById(medal + 'MatchTypeDropdown');
            if (dropdown) {
                dropdown.style.display = dropdown.style.display === 'none' ? 'flex' : 'none';
            }
        };

        // Close medal dropdowns when clicking outside
        document.addEventListener('click', function (e) {
            [['bronzeDropdown', 'bronzeFilterBtn'], ['goldMatchTypeDropdown', 'goldFilterBtn'], ['silverMatchTypeDropdown', 'silverFilterBtn']].forEach(([dropdownId, btnId]) => {
                const dropdown = document.getElementById(dropdownId);
                const btn = document.getElementById(btnId);
                if (dropdown && dropdown.style.display !== 'none') {
                    if (!dropdown.contains(e.target) && e.target !== btn) {
                        dropdown.style.display = 'none';
                    }
                }
            });
        });

        // Age category dropdown filter handler
        window.setAgeCategoryFilter = function (category) {
            currentAgeCategoryFilter = category || 'all';
            renderPlayersList();
        }

        // Search handler
        window.searchPlayers = function (query) {
            currentSearchQuery = query || '';
            renderPlayersList();
        }

        // Delete player - make it global so onclick handler can access it
        window.deletePlayer = async function (playerId, playerName, playerTeamId) {
            if (typeof PLAYER_MANAGER !== 'undefined') {
                await PLAYER_MANAGER.deletePlayer(playerId, playerName, playerTeamId);
            } else {
                // Wait for PLAYER_MANAGER to load
                let attempts = 0;
                const wait = setInterval(() => {
                    attempts++;
                    if (typeof PLAYER_MANAGER !== 'undefined') {
                        clearInterval(wait);
                        PLAYER_MANAGER.deletePlayer(playerId, playerName, playerTeamId);
                    }
                    if (attempts > 50) clearInterval(wait);
                }, 100);
            }
        }

        // Clean up listeners when navigating away so they don't linger
        window.addEventListener('beforeunload', () => {
            _playersUnsubscribers.forEach(unsub => unsub());
        });

        // Override native alert/confirm with custom modals
        window.alert = function (message) {
            return MODAL.showAlert(message);
        };

        window.confirm = function (message) {
            return MODAL.showConfirm(message);
        };
    </script>
</body>

</html>
