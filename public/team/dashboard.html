<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Dashboard - Taekwondo Championship</title>
        <!-- PAGE PROTECTION -->
    <!-- Favicon - Multiple sizes for better visibility -->
    <link rel="icon" type="image/jpeg" href="/assets/images/favicon.jpeg" sizes="any">
    <link rel="apple-touch-icon" href="/assets/images/favicon.jpeg">
    <meta name="theme-color" content="#FFD700">
    <script>
        (function() {
            var role = sessionStorage.getItem('userRole');
            if (role !== 'team') {
                window.location.replace('/index.html');
            }
        })();
    </script>
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preload" as="style" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script defer src="/js/modal.js"></script>
    <style>
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .player-card {
            background: var(--secondary-black);
            border: 2px solid var(--border-gold);
            border-radius: var(--border-radius);
            padding: 20px;
            text-align: center;
        }

        .player-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border-gold);
            margin-bottom: 15px;
        }

        .player-info {
            text-align: left;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--text-gray);
        }

        .player-info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.95rem;
        }

        .player-info-label {
            color: var(--text-gray);
        }

        .player-info-value {
            color: var(--text-white);
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 10px;
        }

        .status-pending {
            background: var(--warning-orange);
            color: var(--primary-black);
        }

        .status-approved {
            background: var(--success-green);
            color: var(--text-white);
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1 class="page-title">👥 TEAM DASHBOARD</h1>
        <div>
            <button class="btn-primary" id="registerBtn" onclick="window.location.href='/register.html'">
                ➕ Register New Player
            </button>
            <button class="btn-danger" onclick="UI.logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="section">
            <h2>Team Information</h2>
            <div id="teamInfo"></div>
        </div>

        <div class="section">
            <h2>Your Player Submissions</h2>
            <div id="playersList" class="player-grid"></div>
        </div>
    </div>

    <!-- Firebase SDK v9 -->
    <script type="module" src="/js/firebase.js"></script>
    <script type="module" src="/js/performance-cache.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script type="module" src="/js/player-manager.js"></script>

    <script type="module">        async function loadTeamInfo() {
            const user = AUTH_MANAGER.getCurrentUser();
            const teamId = user.teamId;

            if (!teamId) {
                document.getElementById('teamInfo').innerHTML = '<p>Team information not found.</p>';
                return;
            }

            try {
                const teamRef = dbRef(database, `teams/${teamId}`);
                const snapshot = await dbGet(teamRef);

                if (snapshot.exists()) {
                    const team = snapshot.val();

                    // ── CHECK PER-TEAM DEADLINE / CLOSED STATUS ──────────────
                    const registerBtn = document.getElementById('registerBtn');
                    const now = new Date();
                    let registrationBlocked = false;
                    let blockedReason = '';

                    if (team.registrationClosed === true) {
                        registrationBlocked = true;
                        blockedReason = 'Registration closed by admin';
                    } else if (team.registrationDeadline) {
                        const dl = new Date(team.registrationDeadline);
                        dl.setHours(23, 59, 59, 999);
                        if (now > dl) {
                            registrationBlocked = true;
                            const fmt = new Date(team.registrationDeadline).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
                            blockedReason = `Deadline passed (${fmt})`;
                        }
                    }

                    if (registrationBlocked && registerBtn) {
                        registerBtn.disabled = true;
                        registerBtn.textContent = '🔒 Registration Closed';
                        registerBtn.title = blockedReason;
                        registerBtn.onclick = () => MODAL.showAlert(`🔒 Registration Closed\n\n${blockedReason}.\n\nPlease contact the organizer.`);
                        registerBtn.style.background = 'var(--accent-red)';
                        registerBtn.style.borderColor = 'var(--accent-red)';
                        registerBtn.style.color = 'var(--text-white)';
                        registerBtn.style.cursor = 'not-allowed';
                        registerBtn.style.opacity = '0.8';
                    }
                    // ────────────────────────────────────────────────────────

                    let html = `
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                            <div class="stat-card">
                                <span class="stat-label">Team Name</span>
                                <span class="stat-value" style="font-size: 1.5rem;">${team.teamName}</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Username</span>
                                <span class="stat-value" style="font-size: 1.5rem;">${team.username}</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Players Registered</span>
                                <span class="stat-value" id="playerCount">0</span>
                            </div>
                        </div>
                    `;
                    document.getElementById('teamInfo').innerHTML = html;
                }
            } catch (error) {
                console.error('Error loading team info:', error);
            }
        }

        async function loadPlayers() {
            const user = AUTH_MANAGER.getCurrentUser();
            const teamId = user.teamId;

            try {
                const playersRef = dbRef(database, 'players');
                const snapshot = await dbGet(playersRef);

                if (!snapshot.exists()) {
                    document.getElementById('playersList').innerHTML = '<p style="color: #888; text-align: center;">No players registered yet. Click "Register New Player" to add your first player.</p>';
                    return;
                }

                const players = [];
                snapshot.forEach(child => {
                    const player = child.val();
                    if (player.teamId === teamId) {
                        players.push({ id: child.key, ...player });
                    }
                });

                document.getElementById('playerCount').textContent = players.length;

                if (players.length === 0) {
                    document.getElementById('playersList').innerHTML = '<p style="color: #888; text-align: center;">No players registered yet. Click "Register New Player" to add your first player.</p>';
                    return;
                }

                // Sort by submission date
                players.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

                let html = '';
                players.forEach(player => {
                    html += `
                        <div class="player-card">
                            <div style="position: relative; display: inline-block; width: 100%;">
                                <img src="${player.playerImage}" alt="${player.playerName}" class="player-image">
                                <button onclick="deletePlayer('${player.id}', '${player.playerName.replace(/'/g, "\\'")}', '${player.teamId}')" style="position: absolute; top: 10px; right: 10px; background: var(--accent-red); border: 2px solid var(--accent-red); border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; padding: 0; transition: all 0.3s ease; box-shadow: 0 4px 8px rgba(0,0,0,0.5);" onmouseover="this.style.background='#cc3333'; this.style.transform='scale(1.1)'" onmouseout="this.style.background='var(--accent-red)'; this.style.transform='scale(1)'" title="Delete this player">
                                    🗑️
                                </button>
                            </div>
                            <h3 style="color: var(--border-gold); margin-bottom: 10px;">${player.playerName}</h3>
                            
                            <div class="player-info">
                                <div class="player-info-row">
                                    <span class="player-info-label">Gender:</span>
                                    <span class="player-info-value">${player.gender}</span>
                                </div>
                                <div class="player-info-row">
                                    <span class="player-info-label">Age:</span>
                                    <span class="player-info-value">${player.age} years</span>
                                </div>
                                <div class="player-info-row">
                                    <span class="player-info-label">Weight:</span>
                                    <span class="player-info-value">${player.weight} kg</span>
                                </div>
                                <div class="player-info-row">
                                    <span class="player-info-label">Age Category:</span>
                                    <span class="player-info-value">${player.ageCategory || 'N/A'}</span>
                                </div>
                                <div class="player-info-row">
                                    <span class="player-info-label">Weight Category:</span>
                                    <span class="player-info-value">${player.weightCategory || 'N/A'}</span>
                                </div>
                                <div class="player-info-row">
                                    <span class="player-info-label">Center:</span>
                                    <span class="player-info-value">${player.centerName}</span>
                                </div>
                                <div class="player-info-row">
                                    <span class="player-info-label">Payment:</span>
                                    <span class="player-info-value">${player.paymentStatus === 'Paid' ? '✅ Paid' : '❌ Not Paid'}</span>
                                </div>
                            </div>
                            
                            <span class="status-badge ${player.status === 'approved' ? 'status-approved' : 'status-pending'}">
                                ${player.status === 'approved' ? '✅ Approved' : '⏳ Pending'}
                            </span>

                            <button class="btn-primary" style="width: 100%; margin-top: 15px;" onclick="editPlayer('${player.id}')">
                                ✏️ Edit Form
                            </button>
                        </div>
                    `;
                });

                document.getElementById('playersList').innerHTML = html;

            } catch (error) {
                console.error('Error loading players:', error);
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            // Page protection - only teams can access
            if (typeof UI !== 'undefined') {
                UI.initPageProtection(['team']);
            }
            loadTeamInfo();
            loadPlayers();
        });

        // Edit player form - make it global so onclick handler can access it
        window.editPlayer = function(playerId) {
            sessionStorage.setItem('editPlayerId', playerId);
            window.location.href = '/register.html?edit=' + playerId;
        }

        // Delete player - make it global so onclick handler can access it
        window.deletePlayer = async function(playerId, playerName, playerTeamId) {
            if (typeof PLAYER_MANAGER !== 'undefined') {
                await PLAYER_MANAGER.deletePlayer(playerId, playerName, playerTeamId);
            } else {
                // Wait for PLAYER_MANAGER to load
                let attempts = 0;
                const wait = setInterval(() => {
                    attempts++;
                    if (typeof PLAYER_MANAGER !== 'undefined') {
                        clearInterval(wait);
                        PLAYER_MANAGER.deletePlayer(playerId, playerName, playerTeamId);
                    }
                    if (attempts > 50) clearInterval(wait);
                }, 100);
            }
        }

        // Override native alert/confirm with custom modals
        window.alert = function(message) {
            return MODAL.showAlert(message);
        };

        window.confirm = function(message) {
            return MODAL.showConfirm(message);
        };
    </script>
</body>
</html>
