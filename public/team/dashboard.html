        .td-stat-1:hover{box-shadow:0 16px 36px rgba(25,118,210,.45), 0 6px 16px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.3);transform:translateY(-6px) scale(1.02)}

        .td-stat-2{background:linear-gradient(135deg, #7B1FA2 0%, #4A148C 100%);border:3px solid rgba(255,255,255,.15);border-radius:24px !important;box-shadow:0 12px 28px rgba(123,31,162,.35), 0 4px 12px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.2);transition:all .4s cubic-bezier(0.34, 1.56, 0.64, 1);position:relative;overflow:hidden;padding:36px 28px !important}
        .td-stat-2::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle, rgba(255,255,255,.2) 0%, transparent 70%);transition:all .6s;pointer-events:none}
        .td-stat-2:hover{box-shadow:0 16px 36px rgba(123,31,162,.45), 0 6px 16px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.3);transform:translateY(-6px) scale(1.02)}
        .td-stat-2:hover::before{right:-20%;top:-20%}
        .td-stat-2 .td-stat-val{color:#FFFFFF;text-shadow:0 2px 4px rgba(0,0,0,.2);font-size:1.8rem !important}
        .td-stat-3{background:linear-gradient(135deg, #FBC02D 0%, #F57F17 100%);border:3px solid rgba(0,0,0,.1);border-radius:24px !important;box-shadow:0 12px 28px rgba(251,192,45,.35), 0 4px 12px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.3);transition:all .4s cubic-bezier(0.34, 1.56, 0.64, 1);position:relative;overflow:hidden;padding:36px 28px !important}
        .td-stat-3::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle, rgba(255,255,255,.25) 0%, transparent 70%);transition:all .6s;pointer-events:none}
        .td-stat-3:hover{box-shadow:0 16px 36px rgba(251,192,45,.45), 0 6px 16px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.4);transform:translateY(-6px) scale(1.02)}

    <script type="module">
        let teamPlayers = [];
        let currentMedalFilter = 'all';
        let currentAgeCategoryFilter = 'all';
        let _playersUnsubscribers = [];

        const MEDAL_PRIORITY = {
            Bronze: 1,
            Silver: 2,
            Gold: 3
        };

        function toOrderedArray(value) {
            if (!value) return [];
            if (Array.isArray(value)) return value;
            return Object.keys(value)
                .sort((a, b) => Number(a) - Number(b))
                .map(key => value[key]);
        }

        function setBestMedal(map, playerId, medalType) {
            if (!playerId || !medalType || !MEDAL_PRIORITY[medalType]) return;
            const current = map[playerId];
            if (!current || MEDAL_PRIORITY[medalType] > MEDAL_PRIORITY[current.type]) {
                map[playerId] = { type: medalType };
            }
        }

        function buildMedalMapFromBrackets(bracketsData) {
            const medalMap = {};
            if (!bracketsData || typeof bracketsData !== 'object') {
                return medalMap;
            }

            Object.values(bracketsData).forEach(bracket => {
                if (!bracket) return;

                const rounds = toOrderedArray(bracket.rounds || []).map(round => toOrderedArray(round));
                // Detect single-player walkover: rounds may be [], or [[]] (one round with zero matches)
                const hasActualMatches = rounds.some(r => r.length > 0);

                if (!hasActualMatches) {
                    // Single-player walkover: no matches, winner is the bye player
                    const byePlayers = bracket.byePlayers || {};
                    const byePlayer = byePlayers['0'];
                    if (byePlayer && byePlayer.id) {
                        setBestMedal(medalMap, byePlayer.id, 'Gold');
                    }
                    return;
                }

                // Final round: champion + runner-up
                const finalRound = rounds[rounds.length - 1] || [];
                const finalMatch = finalRound[0];
                if (finalMatch && finalMatch.status === 'completed' && finalMatch.winner) {
                    const p1 = finalMatch.player1 || null;
                    const p2 = finalMatch.player2 || null;
                    const championId = finalMatch.winner;
                    const runnerUpId = p1 && p1.id === championId ? (p2 && p2.id) : (p1 && p1.id);

                    setBestMedal(medalMap, championId, 'Gold');
                    setBestMedal(medalMap, runnerUpId, 'Silver');
                }

                // Semi-final losers: bronze
                if (rounds.length >= 2) {
                    const semiFinalRound = rounds[rounds.length - 2] || [];
                    semiFinalRound.forEach(match => {
                        if (!match || match.status !== 'completed' || !match.eliminated) return;
                        setBestMedal(medalMap, match.eliminated, 'Bronze');
                    });
                }
            });

            return medalMap;
        }

        function getMedalBadgeHtml(medalType) {
            if (!medalType) return '';

            if (medalType === 'Gold') {
                return '<span class="medal-badge medal-gold">🥇 Gold</span>';
            }
            if (medalType === 'Silver') {
                return '<span class="medal-badge medal-silver">🥈 Silver</span>';

            document.querySelectorAll('[data-medal-filter]').forEach(btn => {
                const isActive = btn.getAttribute('data-medal-filter') === currentMedalFilter;
                btn.classList.toggle('active', isActive);
            });
        }

        function getPlayerAgeCategory(player) {
            return String(player?.ageCategory || '').trim() || 'Unknown';
        }

        function getAgeCategorySortRank(category) {
            const sortOrder = {
                Mini: 1,
                'Sub-Junior': 2,
                Cadet: 3,
                Junior: 4,
                Senior: 5,
                Unknown: 99
            };
            return sortOrder[category] || 50;
        }

        function populateAgeCategoryFilterOptions() {
            const filterSelect = document.getElementById('ageCategoryFilter');
            if (!filterSelect) return;

            const uniqueCategories = [...new Set(teamPlayers.map(getPlayerAgeCategory))]
                .sort((a, b) => {
                    const rankA = getAgeCategorySortRank(a);
                    const rankB = getAgeCategorySortRank(b);
                    if (rankA !== rankB) return rankA - rankB;
                    return a.localeCompare(b);
                });

            filterSelect.innerHTML = '<option value="all">All Categories</option>';
            uniqueCategories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                filterSelect.appendChild(option);
            });

            const hasSelectedCategory = uniqueCategories.includes(currentAgeCategoryFilter);
            if (!hasSelectedCategory) {
                currentAgeCategoryFilter = 'all';
            }
            filterSelect.value = currentAgeCategoryFilter;
            filterSelect.disabled = teamPlayers.length === 0;
        }

        function updatePlayerCount() {
            const countEl = document.getElementById('playerCount');
            if (countEl) countEl.textContent = teamPlayers.length;
        }

        // ── sessionStorage helpers ────────────────────────────────────────────
        // Player TEXT data is cached under 'tdp_{teamId}' (images excluded — stored separately).
        // Images are cached under 'img_{playerId}' to avoid re-downloading on every refresh.
        // Both caches survive page refreshes within the same browser tab session.

        function savePlayersCache(teamId, players) {
            try {
                const slim = players.map(({ playerImage, ...rest }) => rest); // no image blobs in text cache
                sessionStorage.setItem('tdp_' + teamId, JSON.stringify(slim));
                sessionStorage.setItem('tdp_ts_' + teamId, Date.now().toString());
            } catch (_) {} // quota exceeded — skip silently
        }

        function loadPlayersCache(teamId) {
            try {
                const raw = sessionStorage.getItem('tdp_' + teamId);
                const ts  = parseInt(sessionStorage.getItem('tdp_ts_' + teamId) || '0');
                if (!raw || Date.now() - ts > 5 * 60 * 1000) return []; // 5 min TTL
                return JSON.parse(raw);
            } catch (_) { return []; }
        }

        async function fetchPlayerImage(player, playerId) {
            // If image is already embedded in the record, cache it and return
            if (player.playerImage) {
                try { sessionStorage.setItem('img_' + playerId, player.playerImage); } catch (_) {}
                return;
            }
            // Check sessionStorage — avoids re-downloading on every page refresh
            const cached = sessionStorage.getItem('img_' + playerId);
            if (cached) {
                player.playerImage = cached;
                return;
            }
            // Not cached — fetch from Firebase once and cache it
            try {
                const imgSnap = await dbGet(dbRef(database, `playerImages/${playerId}`));
                if (imgSnap.exists()) {
                    player.playerImage = imgSnap.val();
                    try { sessionStorage.setItem('img_' + playerId, imgSnap.val()); } catch (_) {}
                }
            } catch (_) {}
        }

        async function loadPlayers() {
            const user = AUTH_MANAGER.getCurrentUser();
            const teamId = user.teamId;

            // Tear down any previous listeners before re-subscribing
            _playersUnsubscribers.forEach(unsub => unsub());
            _playersUnsubscribers = [];

            try {
                const playersRef = dbRef(database, 'players');
                const bracketsRef = dbRef(database, 'brackets');

                // ── Step 1: Render from sessionStorage cache immediately ───────
                // Images are also in sessionStorage per-player, so fetchPlayerImage
                // reads them from there — zero Firebase downloads on this render pass.
                const cachedPlayers = loadPlayersCache(teamId);
                if (cachedPlayers.length > 0) {
                    teamPlayers = cachedPlayers;
                    await Promise.all(teamPlayers.map(p => fetchPlayerImage(p, p.id)));
                    updatePlayerCount();
                    populateAgeCategoryFilterOptions();
                    renderPlayersList();
                }

                // ── Step 2: Fetch fresh text data from Firebase ───────────────
                // Text data is small (a few KB total). Images are NOT downloaded
                // here because fetchPlayerImage will serve them from sessionStorage.
                const [playersSnapshot, bracketsSnapshot] = await Promise.all([
                    dbGet(playersRef),
                    dbGet(bracketsRef)
                ]);

                const medalMap = bracketsSnapshot.exists()
                    ? buildMedalMapFromBrackets(bracketsSnapshot.val())
                    : {};

                const players = [];
                if (playersSnapshot.exists()) {
                    playersSnapshot.forEach(child => {
                        const player = child.val();
                        if (player.teamId === teamId) {
                            players.push({ id: child.key, ...player, medalType: medalMap[child.key]?.type || null });
                        }
                    });
                }

                players.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

                // Fetch images — hits sessionStorage cache for existing players,
                // only downloads from Firebase for genuinely new players.
                await Promise.all(players.map(p => fetchPlayerImage(p, p.id)));

                teamPlayers = players;
                savePlayersCache(teamId, players); // update text cache for next page load
                updatePlayerCount();
                populateAgeCategoryFilterOptions();
                renderPlayersList();

                // ── Step 3: Real-time listeners ───────────────────────────────
                // Build a Set of already-loaded IDs so onChildAdded skips existing
                // children (Firebase fires it for every existing child using its
                // local SDK cache — no extra network cost, but we skip them because
                // they're already in teamPlayers).
                const loadedIds = new Set(teamPlayers.map(p => p.id));

                // Real-time: new player added
                const unsubAdded = dbOnChildAdded(playersRef, async (snapshot) => {
                    const playerId = snapshot.key;
                    if (loadedIds.has(playerId)) return; // already loaded, skip
                    const player = snapshot.val();
                    if (player.teamId !== teamId) return;

                    loadedIds.add(playerId);
                    await fetchPlayerImage(player, playerId); // caches image in sessionStorage

                    teamPlayers.push({ id: playerId, ...player, medalType: null });
                    teamPlayers.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));
                    savePlayersCache(teamId, teamPlayers);

                    updatePlayerCount();
                    populateAgeCategoryFilterOptions();
                    renderPlayersList();
                });

                // Real-time: existing player updated (e.g. admin approves, edits details)
                // Firebase only sends the single changed player's data — very cheap.
                const unsubChanged = dbOnChildChanged(playersRef, async (snapshot) => {
                    const playerId = snapshot.key;
                    const player = snapshot.val();
                    const idx = teamPlayers.findIndex(p => p.id === playerId);

                    if (player.teamId !== teamId) {
                        if (idx !== -1) {
                            teamPlayers.splice(idx, 1);
                            loadedIds.delete(playerId);
                            sessionStorage.removeItem('img_' + playerId);
                            savePlayersCache(teamId, teamPlayers);
                            updatePlayerCount();
                            populateAgeCategoryFilterOptions();
                            renderPlayersList();
                        }
                        return;
                    }

                    // Admin may have updated the player's image — invalidate its cache
                    // so fetchPlayerImage re-downloads the latest version.
                    sessionStorage.removeItem('img_' + playerId);

                    await fetchPlayerImage(player, playerId); // re-fetches and re-caches image

                    // Preserve medal type — it comes from brackets, not the player record
                    const medalType = idx !== -1 ? teamPlayers[idx].medalType : null;
                    const updated = { id: playerId, ...player, medalType };

                    if (idx !== -1) {
                        teamPlayers[idx] = updated;
                    } else {
                        loadedIds.add(playerId);
                        teamPlayers.push(updated);
                        teamPlayers.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));
                    }

                    savePlayersCache(teamId, teamPlayers);
                    updatePlayerCount();
                    populateAgeCategoryFilterOptions();
                    renderPlayersList();
                });

                // Real-time: player deleted
                const unsubRemoved = dbOnChildRemoved(playersRef, (snapshot) => {
                    const playerId = snapshot.key;
                    const idx = teamPlayers.findIndex(p => p.id === playerId);
                    if (idx !== -1) {
                        teamPlayers.splice(idx, 1);
                        loadedIds.delete(playerId);
                        sessionStorage.removeItem('img_' + playerId); // free up cache space
                        savePlayersCache(teamId, teamPlayers);
                        updatePlayerCount();
                        populateAgeCategoryFilterOptions();
                        renderPlayersList();
                    }
                });

                _playersUnsubscribers = [unsubAdded, unsubChanged, unsubRemoved];

            } catch (error) {
                console.error('Error loading players:', error);
                const playersList = document.getElementById('playersList');
                if (playersList) {
                    playersList.innerHTML = `
                        <div style="grid-column:1/-1;padding:40px 20px;background:rgba(255,23,68,.08);border:2px solid rgba(255,23,68,.3);border-radius:14px;text-align:center">
                            <div style="font-size:2.5rem;margin-bottom:10px">⚠️</div>
                            <div style="color:#ef9a9a;font-weight:700;font-size:1.05rem;margin-bottom:6px">Failed to load players</div>
                            <div style="color:#666;font-size:.85rem;margin-bottom:16px">${error.message || 'Check your connection and try again'}</div>
                            <button onclick="loadPlayers()" style="padding:11px 28px;background:rgba(255,215,0,.1);border:2px solid rgba(255,215,0,.4);border-radius:10px;color:#FFD700;font-weight:700;cursor:pointer;font-size:.9rem">Retry</button>
                        </div>`;
                }
            }
        }

                if (snapshot.exists() && snapshot.val().championship) {
                    const champ = snapshot.val().championship;
                    const title = champ.title || '';

                    const address = champ.address || '';
                    const organizer = champ.organizer || '';
                    const date = champ.date ? new Date(champ.date).toLocaleDateString('en-IN') : '';

                    const tickerContent = `🏆 ${title}  •  📍 Venue: ${venue}  •  📍 Location: ${address}  •  📅 Date: ${date}  •  👤 Organizer: ${organizer}  •  🏆 ${title}  •  📍 Venue: ${venue}  •  📍 Location: ${address}  •  📅 Date: ${date}  •  👤 Organizer: ${organizer}  •  `;

                    const tickerElement = document.getElementById('tickerContent');
                    if (tickerElement) {
                        tickerElement.textContent = tickerContent;
                    }
                } else {
                    const tickerElement = document.getElementById('tickerContent');
                    if (tickerElement) {
                        tickerElement.textContent = '🏆 No championship created yet. Create one from the Championship section.';
                    }
                }
            } catch (error) {
                console.error('Error loading championship ticker:', error);

            currentMedalFilter = medalType;
            updateMedalFilterButtons();
            renderPlayersList();
        }

        // Age category dropdown filter handler
        window.setAgeCategoryFilter = function(category) {
            currentAgeCategoryFilter = category || 'all';
            renderPlayersList();
        }

        // Search handler
        window.searchPlayers = function(query) {
            currentSearchQuery = query || '';
            renderPlayersList();
        }

        // Delete player - make it global so onclick handler can access it
        window.deletePlayer = async function(playerId, playerName, playerTeamId) {
            if (typeof PLAYER_MANAGER !== 'undefined') {
                await PLAYER_MANAGER.deletePlayer(playerId, playerName, playerTeamId);
            } else {
                // Wait for PLAYER_MANAGER to load
                let attempts = 0;
                const wait = setInterval(() => {
                    attempts++;
                    if (typeof PLAYER_MANAGER !== 'undefined') {
                        clearInterval(wait);
                        PLAYER_MANAGER.deletePlayer(playerId, playerName, playerTeamId);
                    }
                    if (attempts > 50) clearInterval(wait);
                }, 100);
            }
        }

        // Clean up listeners when navigating away so they don't linger
        window.addEventListener('beforeunload', () => {
            _playersUnsubscribers.forEach(unsub => unsub());
        });

        // Override native alert/confirm with custom modals
        window.alert = function(message) {
            return MODAL.showAlert(message);
        };

        window.confirm = function(message) {
            return MODAL.showConfirm(message);
        };
    </script>
</body>
</html>
