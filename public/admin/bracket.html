<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Bracket — Taekwondo Championship</title>
    <!-- Favicon - Multiple sizes for better visibility -->
    <link rel="icon" type="image/jpeg" href="/assets/images/favicon.jpeg" sizes="any">
    <link rel="apple-touch-icon" href="/assets/images/favicon.jpeg">
    <meta name="theme-color" content="#FFD700">
    <meta name="description" content="Tournament bracket manager for the Taekwondo Championship — generate and manage single-elimination brackets by weight and age category.">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preload" as="style" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    <script defer src="/js/modal.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .status-filter-tabs { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
        .status-tab { padding:10px 22px; border-radius:30px; border:2px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.04); color:var(--text-gray); font-weight:700; font-size:0.95rem; cursor:pointer; transition:all 0.25s; letter-spacing:0.5px; }
        .status-tab:hover { border-color:var(--border-gold); color:var(--border-gold); background:rgba(255,215,0,0.06); }
        .status-tab.active { background:linear-gradient(135deg,var(--border-gold) 0%,#FFA500 100%); border-color:transparent; color:#000; box-shadow:0 4px 16px rgba(255,215,0,0.4); }

        .category-filter-row { display:flex; align-items:center; gap:14px; margin-bottom:28px; flex-wrap:wrap; }
        .category-filter-label { font-size:0.9rem; font-weight:700; color:var(--accent-cyan); text-transform:uppercase; letter-spacing:1px; white-space:nowrap; }
        .category-filter-select { flex:1; min-width:200px; padding:10px 14px; background:rgba(22,33,62,0.95); border:2px solid var(--accent-cyan); border-radius:10px; color:var(--text-white); font-size:0.95rem; font-weight:600; cursor:pointer; transition:border-color 0.2s; }
        .category-filter-select:focus { outline:none; border-color:var(--border-gold); }

        .categories-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:24px; }

        .category-card { background:linear-gradient(145deg,rgba(15,20,45,0.97) 0%,rgba(22,33,62,0.97) 100%); border:2px solid rgba(255,215,0,0.35); border-radius:18px; padding:28px 24px; cursor:pointer; transition:all 0.3s; position:relative; overflow:hidden; animation:fadeInUp 0.5s ease both; }
        .category-card::before { content:'🥋'; position:absolute; right:-10px; bottom:-10px; font-size:5rem; opacity:0.05; transform:rotate(-15deg); pointer-events:none; transition:opacity 0.3s; }
        .category-card:hover { border-color:var(--border-gold); transform:translateY(-6px); box-shadow:0 16px 40px rgba(255,215,0,0.25); }
        .category-card:hover::before { opacity:0.1; }
        .category-card h3 { font-size:1.25rem; font-weight:800; color:var(--border-gold); margin-bottom:6px; }
        .category-card .weight-label { font-size:0.95rem; color:var(--accent-cyan); font-weight:700; margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; }
        .category-card .player-count { font-size:0.85rem; color:var(--text-gray); opacity:0.7; margin-bottom:14px; }
        .category-card .btn-primary { width:100%; margin-top:6px; padding:11px; font-size:0.95rem; border-radius:10px; font-weight:700; }
        .category-empty-state { text-align:center; padding:60px 20px; color:#555; font-size:1.1rem; border:2px dashed rgba(255,255,255,0.08); border-radius:16px; }

        .bracket-header { display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:32px; padding:20px 24px; background:linear-gradient(135deg,rgba(255,215,0,0.08) 0%,rgba(0,229,255,0.06) 100%); border:2px solid rgba(255,215,0,0.25); border-radius:16px; }
        .bracket-header h2 { flex:1; font-size:1.4rem; font-weight:800; color:var(--border-gold); letter-spacing:1px; margin:0; border:none; padding:0; }
        .btn-back { padding:10px 20px; background:rgba(255,255,255,0.07); border:2px solid rgba(255,255,255,0.2); color:var(--text-white); border-radius:10px; font-weight:700; font-size:0.95rem; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
        .btn-back:hover { border-color:var(--border-gold); color:var(--border-gold); background:rgba(255,215,0,0.08); }

        .bracket-rounds { display:flex; gap:24px; overflow-x:auto; padding-bottom:24px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
        .bracket-rounds::-webkit-scrollbar { height:6px; }
        .bracket-rounds::-webkit-scrollbar-track { background:rgba(255,255,255,0.04); border-radius:3px; }
        .bracket-rounds::-webkit-scrollbar-thumb { background:var(--border-gold); border-radius:3px; }

        .round { flex:0 0 310px; scroll-snap-align:start; }
        .round-title { font-size:1rem; font-weight:900; text-transform:uppercase; letter-spacing:2px; color:var(--border-gold); text-align:center; padding:10px 0; margin-bottom:16px; border-bottom:2px solid rgba(255,215,0,0.25); position:relative; }
        .round-title::after { content:''; position:absolute; bottom:-2px; left:50%; transform:translateX(-50%); width:40px; height:2px; background:var(--border-gold); }
        .matches { display:flex; flex-direction:column; gap:16px; }

        .match { background:linear-gradient(145deg,rgba(15,20,45,0.98) 0%,rgba(22,33,62,0.98) 100%); border:2px solid rgba(255,255,255,0.1); border-radius:14px; padding:18px; transition:all 0.3s; position:relative; overflow:hidden; }
        .match::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:rgba(255,255,255,0.1); border-radius:4px 0 0 4px; }
        .match.pending::before { background:var(--accent-cyan); }
        .match.in-progress::before { background:var(--accent-red); }
        .match.completed::before { background:var(--success-green); }
        .match.in-progress { border-color:rgba(255,23,68,0.4); box-shadow:0 0 24px rgba(255,23,68,0.2); animation:pulseBorder 2s ease-in-out infinite; }
        @keyframes pulseBorder { 0%,100%{box-shadow:0 0 24px rgba(255,23,68,0.2)}50%{box-shadow:0 0 36px rgba(255,23,68,0.4)} }
        .match.completed { border-color:rgba(0,230,118,0.2); }
        .match.same-team-match { border-color:rgba(255,165,0,0.4); }

        .match-players { display:flex; flex-direction:column; gap:8px; }
        /* Name and team stack as two full-width lines (not squeezed side by
           side) so neither ever needs to shrink or truncate to make room for
           the other — each gets the player box's whole width to itself. */
        .player { display:flex; flex-direction:column; align-items:flex-start; gap:3px; padding:10px 40px 10px 12px; border-radius:10px; border:1.5px solid transparent; transition:all 0.2s; position:relative; }
        .player-blue { background:linear-gradient(135deg,rgba(0,51,160,0.25) 0%,rgba(0,30,90,0.2) 100%); border-color:rgba(0,61,165,0.4); }
        .player-red { background:linear-gradient(135deg,rgba(139,0,0,0.25) 0%,rgba(80,0,0,0.2) 100%); border-color:rgba(139,0,0,0.4); }
        .player.winner { border-color:var(--success-green)!important; background:linear-gradient(135deg,rgba(0,230,118,0.15) 0%,rgba(0,200,100,0.08) 100%)!important; box-shadow:0 0 16px rgba(0,230,118,0.2); }
        .player.eliminated { opacity:0.45; text-decoration:line-through; }
        .player-name { font-size:1rem; font-weight:700; color:var(--text-white); white-space:nowrap; }
        .player-center { font-size:0.78rem; color:var(--text-gray); opacity:0.65; white-space:nowrap; }
        .bye { color:#555; font-style:italic; font-weight:400; }
        .vs { text-align:center; font-size:0.75rem; font-weight:900; color:var(--border-gold); letter-spacing:2px; opacity:0.7; padding:2px 0; }

        .match select { width:100%; padding:9px 12px; background:rgba(0,0,0,0.45); border:1.5px solid var(--accent-cyan); color:var(--text-white); border-radius:8px; font-size:0.95rem; margin-bottom:10px; cursor:pointer; }
        .match select:focus { outline:none; border-color:var(--border-gold); }

        .btn-start-match { width:100%; padding:11px; background:linear-gradient(135deg,#00CC55 0%,#00994D 100%); border:none; border-radius:10px; color:#fff; font-weight:800; font-size:0.95rem; cursor:pointer; letter-spacing:0.5px; transition:all 0.2s; box-shadow:0 4px 14px rgba(0,200,80,0.35); }
        .btn-start-match:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,200,80,0.5); }
        .btn-stop-match { width:100%; padding:11px; background:linear-gradient(135deg,#FF1744 0%,#CC0033 100%); border:none; border-radius:10px; color:#fff; font-weight:800; font-size:0.95rem; cursor:pointer; letter-spacing:0.5px; transition:all 0.2s; box-shadow:0 4px 14px rgba(255,23,68,0.4); margin-top:10px; }
        .btn-stop-match:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(255,23,68,0.55); }

        .match-controls { margin-top:14px; }
        .match-in-progress { font-size:0.85rem; color:var(--accent-red); font-weight:700; text-align:center; letter-spacing:0.5px; margin-bottom:10px; padding:6px 10px; background:rgba(255,23,68,0.1); border-radius:8px; }
        .selection-label { display:block; font-size:0.85rem; color:var(--accent-cyan); font-weight:700; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
        .selection-group { display:flex; flex-direction:column; gap:8px; }
        .radio-label { display:flex; align-items:center; gap:10px; padding:9px 12px; background:rgba(255,255,255,0.04); border:1.5px solid rgba(255,255,255,0.1); border-radius:8px; cursor:pointer; font-size:0.9rem; font-weight:600; transition:all 0.2s; }
        .radio-label:hover { border-color:var(--border-gold); background:rgba(255,215,0,0.06); }
        .radio-label input { accent-color:var(--border-gold); width:16px; height:16px; }

        .match-completed-info { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
        .winner-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; background:rgba(0,230,118,0.15); border:1.5px solid var(--success-green); color:var(--success-green); border-radius:20px; font-size:0.85rem; font-weight:700; }
        .eliminated-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; background:rgba(255,23,68,0.1); border:1.5px solid var(--accent-red); color:var(--accent-red); border-radius:20px; font-size:0.85rem; font-weight:700; }
        .bye-card { border-color:rgba(255,165,0,0.3)!important; background:linear-gradient(145deg,rgba(30,20,5,0.95) 0%,rgba(40,30,10,0.95) 100%)!important; }
        .bye-card::before { background:#FFA500!important; }
        .match-actions { display:flex; flex-direction:column; gap:0; }
        .winner-selection { margin-bottom:4px; }

        /* Sequential match number badge */
        .match-number-badge { display:inline-block; font-size:0.72rem; font-weight:800; color:var(--border-gold); background:rgba(255,215,0,0.12); border:1px solid rgba(255,215,0,0.35); border-radius:5px; padding:2px 8px; margin-bottom:8px; letter-spacing:0.5px; }

        /* Player action buttons (edit / delete / fill) — floated in the
           corner (.player is already position:relative, set above) rather
           than sharing the row with the name/team text, now that those
           stack as their own full-width lines instead of a horizontal row. */
        .player-actions { position:absolute; top:8px; right:8px; display:flex; gap:4px; align-items:center; opacity:0; transition:opacity 0.15s; }
        .player:hover .player-actions { opacity:1; }
        .player-action-btn { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18); color:var(--text-white); border-radius:5px; padding:3px 7px; font-size:0.78rem; cursor:pointer; transition:all 0.15s; line-height:1.4; white-space:nowrap; }
        .player-action-btn:hover { background:rgba(255,215,0,0.12); border-color:var(--border-gold); }
        .player-action-btn.delete-btn:hover { background:rgba(255,23,68,0.18); border-color:var(--accent-red); color:var(--accent-red); }
        .player-action-btn.fill-btn { font-size:0.75rem; background:rgba(0,229,255,0.08); border-color:var(--accent-cyan); color:var(--accent-cyan); opacity:1!important; }
        .player-action-btn.fill-btn:hover { background:rgba(0,229,255,0.18); }

        /* Inline edit form inside a player slot */
        .player-edit-form { width:100%; display:flex; flex-direction:column; gap:5px; }
        .player-edit-form input { width:100%; background:rgba(0,0,0,0.55); border:1.5px solid var(--accent-cyan); color:var(--text-white); border-radius:6px; padding:6px 10px; font-size:0.88rem; box-sizing:border-box; }
        .player-edit-form input:focus { outline:none; border-color:var(--border-gold); }

        /* Drop-zone slot for drag-and-drop BYE player */
        .drop-target { border-style:dashed!important; border-color:rgba(0,229,255,0.45)!important; background:rgba(0,229,255,0.05)!important; min-height:44px; }
        .drop-target.drag-over { border-color:var(--border-gold)!important; background:rgba(255,215,0,0.08)!important; }

        /* Skeleton loader for category cards */
        @keyframes bktPulse{0%,100%{opacity:.45}50%{opacity:.2}}
        @keyframes bktShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        .bracket-skeleton-card{
            background:linear-gradient(145deg,rgba(15,20,45,.97),rgba(22,33,62,.97));
            border:2px solid rgba(255,215,0,.1);
            border-radius:18px;
            padding:28px 24px;
            min-height:185px;
            animation:bktPulse 1.5s ease-in-out infinite;
            position:relative;
            overflow:hidden;
        }
        .bracket-skeleton-card::after{
            content:'';
            position:absolute;
            inset:0;
            background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.04) 50%,transparent 100%);
            background-size:200% 100%;
            animation:bktShimmer 1.8s ease-in-out infinite;
        }
        /* ── Messaging bell + panel ───────────────────────────────────────────── */
        .msg-bell-btn {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,215,0,0.05));
            border: 2px solid var(--border-gold); color: var(--border-gold);
            border-radius: 10px; padding: 10px 18px; font-size: 1.1rem;
            cursor: pointer; transition: all 0.25s ease;
            display: flex; align-items: center; gap: 8px; font-weight: 700;
        }
        .msg-bell-btn:hover { background: rgba(255,215,0,0.25); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,215,0,0.3); }
        .msg-badge {
            background: var(--accent-red); color: #fff; font-size: 0.75rem; font-weight: 900;
            min-width: 22px; height: 22px; border-radius: 11px;
            display: inline-flex; align-items: center; justify-content: center; padding: 0 6px;
            animation: pulse-msg 1.5s ease-in-out infinite;
        }
        @keyframes pulse-msg { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
        @keyframes bell-shake {
            0%,100% { transform: translateY(0) rotate(0deg); }
            15%      { transform: translateY(-3px) rotate(-12deg); }
            30%      { transform: translateY(0)   rotate(10deg); }
            45%      { transform: translateY(-2px) rotate(-8deg); }
            60%      { transform: translateY(0)   rotate(6deg); }
            75%      { transform: translateY(-1px) rotate(-3deg); }
        }
        .bell-new-msg {
            animation: bell-shake 0.6s ease forwards !important;
            box-shadow: 0 0 22px rgba(255,215,0,0.7) !important;
            border-color: #FFD700 !important;
            background: rgba(255,215,0,0.3) !important;
        }
        .msg-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:6000; }
        .msg-overlay.open { display:block; }
        .msg-panel {
            position:fixed; top:0; right:0; width:440px; max-width:100vw; height:100vh;
            background:linear-gradient(160deg,rgba(12,18,42,0.99) 0%,rgba(22,33,62,0.99) 100%);
            border-left:2px solid var(--border-gold); box-shadow:-8px 0 40px rgba(0,0,0,0.6);
            display:flex; flex-direction:column; z-index:6001;
            transform:translateX(100%); transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        .msg-panel.open { transform:translateX(0); }
        .msg-panel-header {
            background:linear-gradient(90deg,rgba(255,215,0,0.12),rgba(0,229,255,0.08));
            border-bottom:1px solid rgba(255,215,0,0.25);
            padding:20px 24px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
        }
        .msg-panel-title { font-size:1.2rem; font-weight:800; color:var(--border-gold); letter-spacing:0.5px; }
        .msg-close-btn { background:none; border:none; color:var(--text-gray); font-size:1.4rem; cursor:pointer; padding:4px 8px; border-radius:6px; transition:all 0.2s; }
        .msg-close-btn:hover { color:var(--accent-red); background:rgba(255,23,68,0.1); }
        .msg-compose { padding:20px 24px; border-bottom:1px solid rgba(255,255,255,0.07); flex-shrink:0; }
        .msg-compose-label { font-size:0.78rem; font-weight:700; color:var(--accent-cyan); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
        .msg-select { width:100%; background:rgba(0,0,0,0.4); border:1.5px solid rgba(255,215,0,0.35); border-radius:8px; color:var(--text-white); font-size:0.9rem; padding:9px 12px; cursor:pointer; margin-bottom:10px; transition:border-color 0.2s; }
        .msg-select:focus { outline:none; border-color:var(--border-gold); }
        .msg-type-row { display:flex; gap:8px; margin-bottom:10px; }
        .msg-type-btn { flex:1; padding:8px; border-radius:8px; font-size:0.85rem; font-weight:700; cursor:pointer; border:2px solid transparent; transition:all 0.2s; }
        .msg-type-btn.info  { background:rgba(0,229,255,0.1); border-color:rgba(0,229,255,0.3); color:var(--accent-cyan); }
        .msg-type-btn.info.active  { background:rgba(0,229,255,0.25); border-color:var(--accent-cyan); }
        .msg-type-btn.urgent{ background:rgba(255,23,68,0.1); border-color:rgba(255,23,68,0.3); color:var(--accent-red); }
        .msg-type-btn.urgent.active{ background:rgba(255,23,68,0.25); border-color:var(--accent-red); }
        .msg-textarea { width:100%; box-sizing:border-box; background:rgba(0,0,0,0.35); border:1.5px solid rgba(255,255,255,0.12); border-radius:8px; color:var(--text-white); font-size:0.9rem; font-family:inherit; padding:10px 12px; resize:none; height:72px; margin-bottom:10px; transition:border-color 0.2s; }
        .msg-textarea:focus { outline:none; border-color:var(--border-gold); }
        .msg-textarea::placeholder { color:#555; }
        .msg-send-btn { width:100%; background:linear-gradient(135deg,#FFD700,#FFC107); color:#000; font-weight:800; border:none; border-radius:8px; padding:12px; font-size:0.95rem; cursor:pointer; transition:all 0.2s; }
        .msg-send-btn:hover { opacity:0.9; transform:translateY(-1px); }
        .msg-send-btn:disabled { opacity:0.45; cursor:not-allowed; transform:none; }
        .msg-feed-label { padding:14px 24px 8px; font-size:0.78rem; font-weight:700; color:var(--text-gray); text-transform:uppercase; letter-spacing:1px; flex-shrink:0; }
        .msg-feed { flex:1; overflow-y:auto; padding:0 16px 20px; }
        .msg-feed::-webkit-scrollbar { width:4px; }
        .msg-feed::-webkit-scrollbar-thumb { background:rgba(255,215,0,0.2); border-radius:2px; }
        .msg-item { border-radius:10px; padding:12px 14px; margin-bottom:10px; animation:fadeInUp 0.3s ease; }
        .msg-item.sent { background:linear-gradient(135deg,rgba(0,229,255,0.08),rgba(0,229,255,0.04)); border:1px solid rgba(0,229,255,0.2); border-left:3px solid var(--accent-cyan); }
        .msg-item.sent.urgent-msg { background:linear-gradient(135deg,rgba(255,23,68,0.1),rgba(255,23,68,0.05)); border:1px solid rgba(255,23,68,0.25); border-left:3px solid var(--accent-red); }
        .msg-item.reply { background:linear-gradient(135deg,rgba(255,215,0,0.07),rgba(255,215,0,0.03)); border:1px solid rgba(255,215,0,0.15); border-left:3px solid var(--border-gold); }
        .msg-item.from-admin { background:linear-gradient(135deg,rgba(0,229,255,0.08),rgba(0,229,255,0.03)); border:1px solid rgba(0,229,255,0.2); border-left:3px solid var(--accent-cyan); }
        .msg-item.from-admin.urgent { background:linear-gradient(135deg,rgba(255,23,68,0.12),rgba(255,23,68,0.04)); border:1px solid rgba(255,23,68,0.3); border-left:3px solid var(--accent-red); }
        .msg-item.from-ref { background:linear-gradient(135deg,rgba(255,215,0,0.06),rgba(255,215,0,0.02)); border:1px solid rgba(255,215,0,0.12); border-left:3px solid rgba(255,215,0,0.4); opacity:0.75; }
        .msg-item-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:0.75rem; }
        .msg-item-from { font-weight:700; color:var(--accent-cyan); }
        .msg-item.reply .msg-item-from { color:var(--border-gold); }
        .msg-item.sent.urgent-msg .msg-item-from { color:var(--accent-red); }
        .msg-item.from-ref .msg-item-from { color:rgba(255,215,0,0.6); }
        .msg-item.from-admin.urgent .msg-item-from { color:#ff6b8a; }
        .msg-item-time { color:#555; }
        .msg-item-target { font-size:0.72rem; color:#666; margin-bottom:5px; }
        .msg-item-text { font-size:0.9rem; color:var(--text-white); line-height:1.45; }
        .msg-tag { display:inline-block; font-size:0.65rem; font-weight:700; padding:2px 7px; border-radius:4px; margin-right:6px; text-transform:uppercase; }

    <!-- Official / Expo competition type toggle. Expo is initialized lazily on
         first switch so the default (Official) page load is completely unaffected. -->
    <script>
        let _expoInitialized = false;
        function switchCompetitionType(type) {
            document.querySelectorAll('.status-filter-tabs [data-comp]').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`.status-filter-tabs [data-comp="${type}"]`);
            if (activeBtn) activeBtn.classList.add('active');

            const officialSection = document.getElementById('officialSection');
            const expoSection = document.getElementById('expoSection');

            if (type === 'expo') {
                officialSection.style.display = 'none';
                expoSection.style.display = 'block';
                if (!_expoInitialized && typeof EXPO_BRACKET !== 'undefined') {
                    _expoInitialized = true;
                    EXPO_BRACKET.init();
                }
            } else {
                expoSection.style.display = 'none';
                officialSection.style.display = 'block';
            }
        }

        // Take over the existing "Download Fixture PDF" button bracket.js renders
        // (same button, same label, but generates the official fight-diagram-style
        // layout instead of bracket.js's own PDF export), without editing
        // bracket.js. bracket.js rebuilds #bracketContainer's innerHTML on every
        // render (open category, start match, set winner, stop match, etc.),
        // which wipes out this override — so a MutationObserver reapplies it
        // after each render.
        function takeOverBracketPdfButton() {
            const header = document.querySelector('#bracketContainer .bracket-header');
            if (!header) return;
            const actionsWrap = header.querySelector(':scope > div');
            if (!actionsWrap) return;

            const pdfBtn = actionsWrap.querySelector('button[onclick*="downloadFixturePDF"]');
            if (pdfBtn && !pdfBtn.dataset.overridden) {
                pdfBtn.dataset.overridden = 'true';
                pdfBtn.onclick = downloadOfficialFightDiagramPDF;
            }
        }

        const _officialBracketContainer = document.getElementById('bracketContainer');
        if (_officialBracketContainer) {
            new MutationObserver(takeOverBracketPdfButton)
                .observe(_officialBracketContainer, { childList: true, subtree: true });
        }

        // "Bracket Sheet" style bracket PDF — classic printable tournament sheet:
        // title block, Division/Category lines, seeded single-elimination tree
        // with Match No. at every junction, a Champion line, and a Gold/Silver/
        // Bronze/Bronze table. Reads only BRACKET's already-public currentBracket
        // /categories data (same as the other export buttons) — no bracket.js
        // changes. Replaces the existing "Download Fixture PDF" button's output.
        async function downloadOfficialFightDiagramPDF() {
            if (typeof BRACKET === 'undefined' || !BRACKET.currentBracket) {
                if (typeof MODAL !== 'undefined') MODAL.warning('No bracket loaded.');
                return;
            }
            const JsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || (typeof jsPDF !== 'undefined' ? jsPDF : null);
            if (!JsPDFCtor) {
                if (typeof MODAL !== 'undefined') MODAL.error('PDF library not loaded.');
                return;
            }

            const category = BRACKET.categories[BRACKET.currentCategory];
            const bracket = BRACKET.currentBracket;
            const toArr = o => Array.isArray(o) ? o : Object.keys(o).sort((a, b) => Number(a) - Number(b)).map(k => o[k]);
            const rounds = toArr(bracket.rounds || []).map(r => toArr(r));
            const byePlayers = bracket.byePlayers || {};

            // Championship title/date — read-only lookup, same public data every
            // other page on this app already reads from formConfig.
            let champTitle = 'TAEKWONDO CHAMPIONSHIP';
            let champDate = '';
            try {
                const snap = await dbGet(dbRef(database, 'formConfig'));
                if (snap.exists() && snap.val().championship) {
                    const c = snap.val().championship;
                    if (c.title) champTitle = c.title.toUpperCase();
                    if (c.date) {
                        const d = new Date(c.date);
                        if (!isNaN(d.getTime())) champDate = d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
                    }
                }
            } catch (_) { /* header still renders fine without a date */ }

            const doc = new JsPDFCtor({ orientation: 'portrait', unit: 'pt', format: 'letter' });
            const pageW = doc.internal.pageSize.getWidth();
            const marginX = 40;
            const rightMargin = 40;

            // ── Header ──────────────────────────────────────────────────────
            let y = 44;
            doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
            doc.text(champTitle, pageW / 2, y, { align: 'center' }); y += 15;
            if (champDate) {
                doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
                doc.text(champDate, pageW / 2, y, { align: 'center' }); y += 14;
            }
            doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
            doc.text('TAEKWONDO', pageW / 2, y, { align: 'center' }); y += 20;
            doc.setFontSize(20);
            doc.text('Bracket Sheet', pageW / 2, y, { align: 'center' }); y += 28;

            // ── Division / Category ────────────────────────────────────────
            doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
            doc.text('DIVISION:', marginX, y);
            doc.line(marginX + 62, y + 2, marginX + 260, y + 2);
            doc.text((category.weightCategory || '').toUpperCase(), marginX + 68, y);
            y += 24;

            doc.text('CATEGORY:', marginX, y);
            doc.line(marginX + 62, y + 2, marginX + 300, y + 2);
            doc.text(`${category.ageCategory || ''} ${category.gender || ''}`.trim().toUpperCase(), marginX + 68, y);
            y += 26;

            const bracketTop = y;
            const bottomReserve = 110; // room for the medal table at the foot of the page
            const pageH = doc.internal.pageSize.getHeight();
            const availableH = pageH - bracketTop - bottomReserve;

            // ── Geometry ────────────────────────────────────────────────────
            // bracket.js only builds each round's real match data once the round
            // before it finishes (its own comment: "do NOT pre-build them here"),
            // so a fresh, not-yet-played bracket only has rounds[0] populated —
            // relying on rounds.length alone would draw Round 1 and then jump
            // straight to CHAMPION, skipping every future round. bracket.js
            // already precomputes expectedRoundMatchCounts for exactly this
            // (its comment: "used by PDF and UI to show future-round structure
            // before those rounds are actually built") — use it as the source of
            // truth for how many rounds/matches-per-round the full tree has.
            const expectedCounts = (bracket.expectedRoundMatchCounts && bracket.expectedRoundMatchCounts.length)
                ? bracket.expectedRoundMatchCounts
                : rounds.map(r => r.length);
            const numRounds = Math.max(expectedCounts.length, rounds.length, 1);
            const r1Count = Math.max(rounds[0] ? rounds[0].length : (expectedCounts[0] || 1), 1);
            const slotH = Math.max(40, Math.min(95, availableH / r1Count));
            const champColW = 110;
            const colW = Math.max(90, Math.min(160, (pageW - marginX - rightMargin - champColW) / numRounds));
            const lineLen = Math.min(95, colW * 0.62);

            // Vertical center of round r (0-indexed), match j — round 0 centers are
            // fixed slots; every later round's match centers on the midpoint of the
            // two matches feeding it. Falls back to even spacing if a round's size
            // doesn't cleanly halve the previous one (e.g. an odd bye pattern).
            const centers = [];
            centers[0] = rounds[0] ? rounds[0].map((_, j) => bracketTop + j * slotH + slotH / 2) : [bracketTop + slotH / 2];
            for (let r = 1; r < numRounds; r++) {
                const prev = centers[r - 1] || [];
                const count = rounds[r] ? rounds[r].length : (expectedCounts[r] || Math.max(1, Math.ceil(prev.length / 2)));
                const c = [];
                for (let j = 0; j < count; j++) {
                    const a = prev[j * 2], b = prev[j * 2 + 1];
                    if (a !== undefined && b !== undefined) c.push((a + b) / 2);
                    else if (a !== undefined) c.push(a);
                    else c.push(bracketTop + j * slotH + slotH / 2);
                }
                centers[r] = c;
            }

            let matchCounter = 1;
            doc.setLineWidth(1);

            const drawSlot = (x, yc, player, label) => {
                doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
                doc.text(label ? `${label}` : '', x - 16, yc + 3);
                doc.line(x, yc, x + lineLen, yc);
                if (player) {
                    doc.setFont('helvetica', 'bold'); doc.setFontSize(9);
                    doc.text(player.playerName || '', x + 3, yc - 3);
                    doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
                    doc.text(player.centerName || player.teamName || '', x + 3, yc + 10);
                } else {
                    doc.setFont('helvetica', 'italic'); doc.setFontSize(8);
                    doc.text('TBD', x + 3, yc - 3);
                }
            };

            for (let r = 0; r < numRounds; r++) {
                const x = marginX + r * colW;
                // Use real match data where the round has already been built;
                // otherwise synthesize blank TBD placeholders sized to the
                // expected match count so the full tree still draws correctly.
                const expectedCount = expectedCounts[r] || (rounds[r] ? rounds[r].length : 1);
                const roundMatches = rounds[r] || Array.from({ length: expectedCount }, () => ({ player1: null, player2: null, winner: null }));
                const roundCenters = centers[r] || [];

                roundMatches.forEach((match, j) => {
                    const yTop = roundCenters[j] - slotH * 0.22;
                    const yBot = roundCenters[j] + slotH * 0.22;
                    drawSlot(x, yTop, match.player1, r === 0 ? (j * 2 + 1) : '');
                    drawSlot(x, yBot, match.player2, r === 0 ? (j * 2 + 2) : '');

                    // Connector: vertical bracket + stub reaching toward next round
                    const xEnd = x + lineLen;
                    const stubEnd = x + colW;
                    doc.line(xEnd, yTop, xEnd, yBot);
                    doc.line(xEnd, roundCenters[j], stubEnd, roundCenters[j]);

                    doc.setFont('helvetica', 'normal'); doc.setFontSize(8);
                    doc.text('Match No:', xEnd + 4, roundCenters[j] - 8);
                    doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
                    doc.text(String(matchCounter++), xEnd + 4, roundCenters[j] - 8 + 15);
                });

                // Byes: rendered as an extra labeled slot below this round's real
                // matches — bracket.js tracks at most one bye per round, advancing
                // straight to the next round without a match.
                const bye = byePlayers[String(r)];
                if (bye) {
                    const byeY = bracketTop + (roundMatches.length + 0.5) * slotH + r * 4;
                    drawSlot(x, byeY, bye, '');
                    doc.setFont('helvetica', 'italic'); doc.setFontSize(8);
                    doc.text('BYE (advances automatically)', x + lineLen + 8, byeY);
                }
            }

            // ── Champion ────────────────────────────────────────────────────
            const lastRoundCenters = centers[numRounds - 1] || [bracketTop + slotH / 2];
            const champY = lastRoundCenters[0];
            const champX = marginX + numRounds * colW;
            doc.setLineWidth(1);
            doc.line(champX, champY, champX + champColW - 10, champY);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
            doc.text('CHAMPION', champX, champY - 8);

            // ── Medal table ─────────────────────────────────────────────────
            const tableW = 320, rowH = 20, colSplit = 90;
            const tableX = marginX, tableY = pageH - bottomReserve + 20;
            const labels = ['GOLD:', 'SILVER:', 'BRONZE:', 'BRONZE:'];
            doc.setLineWidth(0.75);
            labels.forEach((label, i) => {
                const ry = tableY + i * rowH;
                doc.rect(tableX, ry, colSplit, rowH);
                doc.rect(tableX + colSplit, ry, tableW - colSplit, rowH);
                doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
                doc.text(label, tableX + 4, ry + 14);
            });

            const fileName = `Fight_Diagram_${category.gender}_${category.ageCategory}_${category.weightCategory}.pdf`.replace(/\s+/g, '_');
            doc.save(fileName);
        }
    </script>

    <script type="module">
        // ES modules are deferred and run after DOM is ready.
        // DOMContentLoaded has already fired by the time this executes,
        // so we call init() directly — no listener needed.
        if (typeof UI !== 'undefined') {
            UI.initPageProtection(['admin', 'judge', 'referee']);
        }
        if (typeof BRACKET !== 'undefined') {
            BRACKET.init();
        }

        // Clean up bracket listeners on page unload only. Tearing them down on
        // mere tab-hide (screen lock, app switch — routine on referee tablets)
        // used to kill real-time sync permanently, since nothing ever resubscribed
        // when the tab came back: the bracket view would silently stop receiving
        // other courts' updates until the user manually clicked Back and reopened it.
        window.addEventListener('beforeunload', () => {
            if (typeof BRACKET !== 'undefined' && BRACKET.bracketListener) {
                BRACKET.stopBracketListeners();
            }
        });
    </script>

    <!-- Override native alert/confirm with custom modals -->
    <script>
        window.alert = function (message) {
            return MODAL.showAlert(message);
        };

        window.confirm = function (message) {
            return MODAL.showConfirm(message);
        };
    </script>

    <script type="module" src="/js/messaging.js"></script>
    <script defer src="/js/notifications.js"></script>

    <!-- ── Bracket page messaging (role-aware: admin/judge/referee) ── -->
    <script type="module">
        var _bktPanelOpen  = false;
        var _bktMsgType    = 'info';
        var _bktUserUid    = null;
        var _bktUnsub      = null;
        var _bktPrevUnread = 0;

        function bktWaitReady(cb) {
            if (typeof window.MESSAGING !== 'undefined'
                && typeof window.firestore !== 'undefined'
                && typeof window.onAuthStateChanged === 'function'
                && window.auth) {
                cb();
            } else {
                setTimeout(() => bktWaitReady(cb), 100);
            }
        }

        bktWaitReady(() => {
            const unsubAuth = window.onAuthStateChanged(window.auth, async (user) => {
                if (!user) return;
                unsubAuth();
                _bktUserUid = user.uid;
                sessionStorage.setItem('firebaseUid', user.uid);
                const role = sessionStorage.getItem('userRole') || '';
                if (role === 'admin' || role === 'judge') {
                    const compose = document.getElementById('bktAdminCompose');
                    if (compose) compose.style.display = 'block';
                    await window.MESSAGING.initAdmin(user.uid);
                    await bktLoadCourts();
                    if (window.NOTIFY) window.NOTIFY.init('admin');
                    _bktUnsub = window.MESSAGING.listenAdmin((msgs) => {
                        bktRenderFeed(msgs, 'admin');
                        bktUpdateBadge(msgs, 'admin');
                        if (window.NOTIFY) window.NOTIFY.processMessages(msgs, _bktUserUid, window.openMsgPanel);
                    });
                } else if (role === 'referee') {
                    const compose = document.getElementById('bktRefCompose');
                    if (compose) compose.style.display = 'block';
                    if (window.NOTIFY) window.NOTIFY.init('referee');
                    _bktUnsub = window.MESSAGING.listenReferee((msgs) => {
                        bktRenderFeed(msgs, 'referee');
                        bktUpdateBadge(msgs, 'referee');
                        if (window.NOTIFY) window.NOTIFY.processMessages(msgs, _bktUserUid, window.openMsgPanel);
                    });
                }
            });
        });

        async function bktLoadCourts() {
            if (!window.database || !window.dbGet || !window.dbRef) return;
            try {
                const snap = await window.dbGet(window.dbRef(window.database, 'referees'));
                const courts = new Set();
                if (snap.exists()) {
                    snap.forEach(child => {
                        const cn = child.val().courtNumber;
                        if (cn && String(cn).trim()) courts.add(String(cn).trim());
                    });
                }
                const select = document.getElementById('bktMsgTarget');
                if (!select) return;
                const sorted = Array.from(courts).sort((a, b) => Number(a) - Number(b));
                let options = '<option value="broadcast">&#x1F4E2; All Courts (Broadcast)</option>';
                sorted.forEach(cn => { options += `<option value="court_${cn}">&#x1F3DF; Court ${cn}</option>`; });
                select.innerHTML = options;
            } catch (e) { console.warn('[MESSAGING] bktLoadCourts:', e.message); }
        }

        window.toggleMsgPanel = function () { _bktPanelOpen ? closeMsgPanel() : openMsgPanel(); };

        window.openMsgPanel = function () {
            _bktPanelOpen = true;
            document.getElementById('msgPanel').classList.add('open');
            document.getElementById('msgOverlay').classList.add('open');
            document.getElementById('bktBadge').style.display = 'none';
            const role = sessionStorage.getItem('userRole') || '';
            if (role === 'admin' || role === 'judge') bktLoadCourts();
        };

        window.closeMsgPanel = function () {
            _bktPanelOpen = false;
            document.getElementById('msgPanel').classList.remove('open');
            document.getElementById('msgOverlay').classList.remove('open');
        };

        window.setMsgType = function (type) {
            _bktMsgType = type;
            document.getElementById('bktMsgTypeInfo').classList.toggle('active', type === 'info');
            document.getElementById('bktMsgTypeUrgent').classList.toggle('active', type === 'urgent');
        };

        window.sendAdminMessage = async function () {
            const to   = document.getElementById('bktMsgTarget').value;
            const text = document.getElementById('bktMsgText').value.trim();
            if (!text) return;
            const btn = document.getElementById('bktMsgSendBtn');
            btn.disabled = true; btn.textContent = 'Sending...';
            try {
                await window.MESSAGING.sendMessage(to, text, _bktMsgType);
                document.getElementById('bktMsgText').value = '';
            } catch (e) { alert('Failed to send: ' + e.message); }
            finally { btn.disabled = false; btn.textContent = 'Send Message'; }
        };

        window.sendRefNewMessage = async function () {
            const input = document.getElementById('bktRefNewMsgText');
            const btn   = document.getElementById('bktRefSendBtn');
            if (!input || !input.value.trim()) return;
            btn.disabled = true; btn.textContent = 'Sending...';
            try {
                await window.MESSAGING.sendRefMessage(input.value.trim());
                input.value = '';
            } catch (e) { alert('Failed to send: ' + e.message); }
            finally { btn.disabled = false; btn.textContent = 'Send'; }
        };

        window.toggleReply = function (msgId) {
            const area = document.getElementById('bkt-reply-' + msgId);
            if (!area) return;
            area.classList.toggle('open');
            if (area.classList.contains('open')) {
                const inp = area.querySelector('.msg-reply-input');
                if (inp) inp.focus();
            }
        };

        window.sendRefReply = async function (msgId, btnEl) {
            const area  = document.getElementById('bkt-reply-' + msgId);
            const input = area && area.querySelector('.msg-reply-input');
            if (!input || !input.value.trim()) return;
            btnEl.disabled = true; btnEl.textContent = '...';
            try {
                await window.MESSAGING.sendReply(input.value.trim(), msgId);
                input.value = ''; area.classList.remove('open');
            } catch (e) { alert('Failed to send reply: ' + e.message); }
            finally { btnEl.disabled = false; btnEl.textContent = 'Send'; }
        };

        window.sendRefQuickReply = async function (msgId, text, btnEl) {
            btnEl.disabled = true;
            try {
                await window.MESSAGING.sendReply(text, msgId);
            } catch (e) { alert('Failed to send reply: ' + e.message); }
            finally { btnEl.disabled = false; }
        };

        window.sendAdminQuickReply = async function(msgId, to, text, btnEl) {
            btnEl.disabled = true;
            try {
                await window.MESSAGING.sendMessage(to, text, 'info');
            } catch (e) { alert('Failed to send: ' + e.message); }
            finally { btnEl.disabled = false; }
        };

        window.sendAdminCustomReply = async function(msgId, to, btnEl) {
            const area = document.getElementById('bkt-reply-' + msgId);
            const input = area && area.querySelector('.msg-reply-input');
            if (!input || !input.value.trim()) return;
            btnEl.disabled = true; btnEl.textContent = '...';
            try {
                await window.MESSAGING.sendMessage(to, input.value.trim(), 'info');
                input.value = ''; area.classList.remove('open');
            } catch (e) { alert('Failed to send: ' + e.message); }
            finally { btnEl.disabled = false; btnEl.textContent = 'Send'; }
        };

        window.deleteAdminMsg = async function (msgId, btnEl) {
            if (!msgId) return;
            const confirmed = await MODAL.showConfirm('Delete this message? This cannot be undone.');
            if (!confirmed) return;
            btnEl.disabled = true; btnEl.textContent = '...';
            try {
                await window.MESSAGING.deleteMessage(msgId);
                const el = document.getElementById('bktmsg-' + msgId);
                if (el) el.remove();
            } catch (e) {
                alert('Failed to delete: ' + e.message);
                btnEl.disabled = false; btnEl.textContent = '&#x1F5D1;';
            }
        };

        function bktRenderFeed(msgs, role) {
            const feed = document.getElementById('msgFeed');
            if (!msgs || msgs.length === 0) {
                feed.innerHTML = '<div class="msg-empty">No messages yet.</div>';
                return;
            }
            if (role === 'admin') {
                feed.innerHTML = msgs.map(m => {
                    const fromRef   = m.fromRole === 'referee';
                    const isReply   = m.isReply === true && fromRef;
                    const isRefNew  = fromRef && !m.isReply;
                    const isUrgent  = m.type === 'urgent';
                    const isAdminMsg = !fromRef;
                    let cls = 'sent';
                    if (isReply)  cls = 'reply';
                    if (isRefNew) cls = 'reply msg-item-new-from-ref';
                    if (isAdminMsg && isUrgent) cls = 'sent urgent-msg';
                    const time = m.timestamp
                        ? new Date(m.timestamp.toMillis()).toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' })
                        : '&#x2014;';
                    let targetTag;
                    if (fromRef) {
                        const label = isReply ? '&#x21A9; Reply' : '&#x1F4E4; New Message';
                        targetTag = `<span class="msg-tag reply-tag">${label} &mdash; ${bktEsc(m.fromName||'Referee')} (Court ${bktEsc(m.courtNumber||'?')})</span>`;
                    } else {
                        targetTag = m.to === 'broadcast'
                            ? '<span class="msg-tag broadcast">&#x1F4E2; Broadcast</span>'
                            : `<span class="msg-tag court">&#x1F3DF; Court ${bktEsc(m.courtNumber||m.to.replace('court_',''))}</span>`;
                    }
                    const urgentTag  = isUrgent && isAdminMsg ? '<span class="msg-tag urgent">&#x1F534; Urgent</span>' : '';
                    const senderLabel = fromRef ? (isReply ? '&#x21A9; ' : '&#x1F4E4; ') + bktEsc(m.fromName||'Referee') : '&#x1F4E4; You';
                    const deleteBtn  = `<button class="msg-delete-btn" onclick="deleteAdminMsg('${m.id}',this)" title="Delete">&#x1F5D1;</button>`;
                    let replySection = '';
                    if (fromRef) {
                        const courtId = m.courtNumber ? 'court_' + m.courtNumber : 'broadcast';
                        replySection = `<button class="msg-open-reply-btn" onclick="toggleReply('${m.id}')">&#x21A9; Reply</button>
                            <div class="msg-reply-area" id="bkt-reply-${m.id}">
                                <div class="quick-replies" style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
                                    <button class="quick-reply-btn" onclick="sendAdminQuickReply('${m.id}', '${courtId}', 'Acknowledged', this)">Acknowledged</button>
                                    <button class="quick-reply-btn" onclick="sendAdminQuickReply('${m.id}', '${courtId}', 'Will check', this)">Will check</button>
                                    <button class="quick-reply-btn" onclick="sendAdminQuickReply('${m.id}', '${courtId}', 'Please proceed', this)">Please proceed</button>
                                </div>
                                <div style="display:flex; gap:8px;">
                                    <textarea class="msg-reply-input" placeholder="Type your reply..."></textarea>
                                    <button class="msg-reply-btn" onclick="sendAdminCustomReply('${m.id}', '${courtId}', this)">Send</button>
                                </div>
                            </div>`;
                    }

                    return `<div class="msg-item ${cls}" id="bktmsg-${m.id}">
                        <div class="msg-item-meta">
                            <span class="msg-item-from">${senderLabel}</span>
                            <span style="display:flex;align-items:center;gap:8px;"><span class="msg-item-time">${time}</span>${deleteBtn}</span>
                        </div>
                        <div class="msg-item-target">${targetTag}${urgentTag}</div>
                        <div class="msg-item-text">${bktEsc(m.text)}</div>
                        ${replySection}
                    </div>`;
                }).join('');
            } else {
                feed.innerHTML = msgs.map(m => {
                    const isFromAdmin = m.fromRole === 'admin';
                    const isUrgent    = m.type === 'urgent';
                    const isOwnReply  = m.fromRole === 'referee';
                    const cls  = isOwnReply ? 'from-ref' : ('from-admin' + (isUrgent ? ' urgent' : ''));
                    const time = m.timestamp ? new Date(m.timestamp.toMillis()).toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' }) : '&#x2014;';
                    const tag  = isOwnReply
                        ? '<span class="msg-tag sent-tag">&#x21A9; Your Reply</span>'
                        : (m.to === 'broadcast'
                            ? '<span class="msg-tag broadcast">&#x1F4E2; All Courts</span>'
                            : `<span class="msg-tag court">&#x1F3DF; Court ${bktEsc(m.courtNumber||'')}</span>`);
                    const urgentTag   = (isUrgent && isFromAdmin) ? '<span class="msg-tag urgent">&#x1F534; Urgent</span>' : '';
                    const replySection = isFromAdmin
                        ? `<button class="msg-open-reply-btn" onclick="toggleReply('${m.id}')">&#x21A9; Reply</button>
                           <div class="msg-reply-area" id="bkt-reply-${m.id}">
                               <div class="quick-replies" style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
                                   <button class="quick-reply-btn" onclick="sendRefQuickReply('${m.id}', 'Acknowledged', this)">Acknowledged</button>
                                   <button class="quick-reply-btn" onclick="sendRefQuickReply('${m.id}', 'Will do', this)">Will do</button>
                                   <button class="quick-reply-btn" onclick="sendRefQuickReply('${m.id}', 'Need assistance', this)">Need assistance</button>
                               </div>
                               <div style="display:flex; gap:8px;">
                                   <textarea class="msg-reply-input" placeholder="Type your reply..."></textarea>
                                   <button class="msg-reply-btn" onclick="sendRefReply('${m.id}',this)">Send</button>
                               </div>
                           </div>`
                        : '';
                    return `<div class="msg-item ${cls}">
                        <div class="msg-item-meta">
                            <span class="msg-item-from">${isOwnReply ? '&#x21A9; You' : '&#x1F4E9; Admin'}</span>
                            <span class="msg-item-time">${time}</span>
                        </div>
                        <div>${tag}${urgentTag}</div>
                        <div class="msg-item-text">${bktEsc(m.text)}</div>
                        ${replySection}
                    </div>`;
                }).join('');
            }
        }

        function bktUpdateBadge(msgs, role) {
            if (_bktPanelOpen) return;
            const uid = sessionStorage.getItem('firebaseUid') || _bktUserUid;
            let count = 0;
            if (uid) {
                if (role === 'admin' || role === 'judge') {
                    count = msgs.filter(m => m.fromRole === 'referee' && (!m.readBy || !m.readBy[uid])).length;
                } else {
                    count = msgs.filter(m => m.fromRole === 'admin' && (!m.readBy || !m.readBy[uid])).length;
                }
            }
            const badge = document.getElementById('bktBadge');
            const bell  = document.getElementById('bktBellBtn');
            if (!badge) return;
            badge.textContent = count > 99 ? '99+' : count;
            badge.style.display = count > 0 ? 'flex' : 'none';
            if (count > _bktPrevUnread && bell) {
                bell.classList.remove('bell-new-msg');
                void bell.offsetWidth;
                bell.classList.add('bell-new-msg');
                setTimeout(() => bell.classList.remove('bell-new-msg'), 1800);
            }
            _bktPrevUnread = count;
        }

        function bktEsc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        document.addEventListener('keydown', e => { if (e.key === 'Escape' && _bktPanelOpen) closeMsgPanel(); });
    </script>
</body>

</html>
