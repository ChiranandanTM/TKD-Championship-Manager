<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Matches - Taekwondo Championship</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <script src="/js/modal.js"></script>
    <style>
        .live-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .live-card {
            background: linear-gradient(135deg, rgba(22,33,62,0.98) 0%, rgba(26,26,46,0.98) 100%);
            border: 3px solid var(--accent-red);
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: 0 0 30px rgba(255,23,68,0.35);
            position: relative;
        }

        .next-card {
            background: var(--card-black);
            border: 2px solid var(--border-gold);
            border-radius: var(--border-radius);
            padding: 24px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-red);
            color: white;
            font-size: 0.82rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: blink 1s step-start infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .next-badge {
            display: inline-block;
            background: var(--border-gold);
            color: var(--primary-black);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .court-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--accent-cyan);
            color: var(--primary-black);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .match-category {
            font-size: 0.95rem;
            color: var(--accent-cyan);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            padding-right: 90px;
        }

        .match-vs-row {
            display: flex;
            align-items: stretch;
            gap: 10px;
            margin: 14px 0;
        }

        .player-box {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 14px 10px;
            text-align: center;
        }

        .player-box .p-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-white);
            word-break: break-word;
            line-height: 1.3;
        }

        .player-box .p-center {
            font-size: 0.82rem;
            color: var(--text-gray);
            margin-top: 4px;
        }

        .vs-col {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--border-gold);
            flex-shrink: 0;
            min-width: 36px;
        }

        .match-meta {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-top: 10px;
        }

        .section-heading {
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 36px 0 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid;
        }

        .section-heading.live-heading {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .section-heading.next-heading {
            color: var(--border-gold);
            border-color: var(--border-gold);
        }

        .empty-box {
            text-align: center;
            padding: 40px;
            color: var(--text-gray);
            background: rgba(255,255,255,0.02);
            border: 2px dashed rgba(255,255,255,0.1);
            border-radius: var(--border-radius);
            font-size: 1.1rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--success-green);
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1 class="page-title">🔴 LIVE MATCHES</h1>
        <div style="display: flex; gap: 12px;">
            <button class="btn-secondary" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
            <button class="btn-danger" onclick="UI.logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="status-bar">
            <span><span class="status-dot"></span> Auto-updating in real time</span>
            <span id="lastUpdated" style="color: var(--text-gray);">Connecting...</span>
        </div>

        <div class="section-heading live-heading">🔴 Live Now</div>
        <div class="live-grid" id="liveGrid">
            <div class="empty-box">⏳ Waiting for live matches...</div>
        </div>

        <div class="section-heading next-heading">⏭️ Up Next</div>
        <div class="live-grid" id="nextGrid">
            <div class="empty-box">No upcoming matches queued.</div>
        </div>
    </div>

    <script type="module" src="/js/firebase.js"></script>
    <script type="module" src="/js/performance-cache.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/ui.js"></script>

    <script type="module">

        // ── AUTH PROTECTION ──────────────────────────────────────────────────
        function waitForUI(cb) {
            if (typeof UI !== 'undefined' && typeof AUTH_MANAGER !== 'undefined') {
                cb();
            } else {
                setTimeout(() => waitForUI(cb), 80);
            }
        }
        waitForUI(() => {
            UI.initPageProtection(['admin', 'judge']);
        });

        // ── HELPERS ──────────────────────────────────────────────────────────
        function getRoundName(roundIndex, totalRounds) {
            const fromEnd = totalRounds - 1 - roundIndex;
            if (fromEnd === 0) return 'Final';
            if (fromEnd === 1) return 'Semi-Final';
            if (fromEnd === 2) return 'Quarter-Final';
            return 'Round ' + (roundIndex + 1);
        }

        function formatCategoryKey(key) {
            return key.replace(/-/g, ' · ');
        }

        function renderCard(item, isLive) {
            const p1 = item.match.player1;
            const p2 = item.match.player2;
            const court = item.match.courtNumber;
            const startTime = item.match.startTime
                ? new Date(item.match.startTime).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
                : null;

            if (isLive) {
                return '<div class="live-card">' +
                    (court ? '<div class="court-badge">🏟️ Court ' + court + '</div>' : '') +
                    '<div class="live-badge"><span class="live-dot"></span> LIVE</div>' +
                    '<div class="match-category">' + formatCategoryKey(item.categoryKey) + '</div>' +
                    '<div class="match-vs-row">' +
                        '<div class="player-box"><div class="p-name">' + p1.playerName + '</div><div class="p-center">' + (p1.centerName || '') + '</div></div>' +
                        '<div class="vs-col">VS</div>' +
                        '<div class="player-box"><div class="p-name">' + p2.playerName + '</div><div class="p-center">' + (p2.centerName || '') + '</div></div>' +
                    '</div>' +
                    '<div class="match-meta">📍 ' + item.roundName + (startTime ? ' &nbsp;|&nbsp; ⏱️ Started ' + startTime : '') + '</div>' +
                '</div>';
            } else {
                return '<div class="next-card">' +
                    '<div class="next-badge">⏭️ UP NEXT</div>' +
                    '<div class="match-category">' + formatCategoryKey(item.categoryKey) + '</div>' +
                    '<div class="match-vs-row">' +
                        '<div class="player-box"><div class="p-name">' + p1.playerName + '</div><div class="p-center">' + (p1.centerName || '') + '</div></div>' +
                        '<div class="vs-col">VS</div>' +
                        '<div class="player-box"><div class="p-name">' + p2.playerName + '</div><div class="p-center">' + (p2.centerName || '') + '</div></div>' +
                    '</div>' +
                    '<div class="match-meta">📍 ' + item.roundName + '</div>' +
                '</div>';
            }
        }

        function processAndRender(snapshot) {
            const liveMatches = [];
            const nextMatches = [];

            if (snapshot.exists()) {
                const allBrackets = snapshot.val();

                Object.entries(allBrackets).forEach(function(entry) {
                    const categoryKey = entry[0];
                    const bracket = entry[1];

                    if (!bracket || !bracket.rounds) return;

                    // Firebase stores arrays as objects with numeric keys — convert safely
                    const rounds = Array.isArray(bracket.rounds)
                        ? bracket.rounds
                        : Object.values(bracket.rounds);

                    const totalRounds = rounds.length;
                    let foundNext = false;

                    rounds.forEach(function(round, roundIndex) {
                        if (!round) return;

                        // Same fix for each round
                        const matches = Array.isArray(round)
                            ? round
                            : Object.values(round);

                        matches.forEach(function(match) {
                            if (!match || !match.player1 || !match.player2) return;

                            const roundName = getRoundName(roundIndex, totalRounds);

                            if (match.status === 'in-progress') {
                                liveMatches.push({ categoryKey, roundName, match });
                            } else if (match.status === 'pending' && !foundNext) {
                                nextMatches.push({ categoryKey, roundName, match });
                                foundNext = true;
                            }
                        });
                    });
                });
            }

            // Sort live by court number
            liveMatches.sort(function(a, b) {
                return (parseInt(a.match.courtNumber) || 999) - (parseInt(b.match.courtNumber) || 999);
            });

            // Render live
            const liveGrid = document.getElementById('liveGrid');
            liveGrid.innerHTML = liveMatches.length > 0
                ? liveMatches.map(function(item) { return renderCard(item, true); }).join('')
                : '<div class="empty-box">No matches are live right now.</div>';

            // Render next
            const nextGrid = document.getElementById('nextGrid');
            nextGrid.innerHTML = nextMatches.length > 0
                ? nextMatches.map(function(item) { return renderCard(item, false); }).join('')
                : '<div class="empty-box">No upcoming matches yet.</div>';

            document.getElementById('lastUpdated').textContent =
                'Updated: ' + new Date().toLocaleTimeString('en-IN');
        }

        // ── REAL-TIME LISTENER ───────────────────────────────────────────────
        // Polls until Firebase globals are ready, then attaches dbOnValue to /brackets
        function startListener() {
            if (typeof database === 'undefined' || typeof dbOnValue === 'undefined' || typeof dbRef === 'undefined') {
                setTimeout(startListener, 100);
                return;
            }
            dbOnValue(dbRef(database, 'brackets'), processAndRender);
            console.log('✅ Live listener attached to /brackets');
        }

        startListener();

        window.alert = function(msg) { if (typeof MODAL !== 'undefined') return MODAL.showAlert(msg); };
        window.confirm = function(msg) { if (typeof MODAL !== 'undefined') return MODAL.showConfirm(msg); };
    </script>
</body>
</html>
